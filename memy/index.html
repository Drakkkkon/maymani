<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16161d">
<title>Мое_мемы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Russo+One&family=Lobster&family=Pacifico&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Comfortaa:wght@400;700&family=Caveat:wght@400;700&family=Press+Start+2P&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="logo">Мое_мемы <span class="ver" id="ver"></span></div>
</header>

<main>
  <!-- ===== Страница 1: Мемы ===== -->
  <section id="page-memes" class="page active">
    <div class="subtabs">
      <button class="subtab active" data-sub="new">Новые</button>
      <button class="subtab" data-sub="classic">Классика</button>
      <button class="subtab" data-sub="fav">Избранное</button>
    </div>
    <div class="searchbar">
      <input id="search" type="search" placeholder="Поиск мема (названия на английском)…" autocomplete="off">
      <label class="btn small" title="Своя картинка">📷 Своя<input id="upload" type="file" accept="image/*" hidden></label>
    </div>
    <div id="count" class="count"></div>
    <div id="saved-block" class="hidden">
      <h3 class="block-title">Мои сохранённые мемы</h3>
      <div id="saved-grid" class="grid"></div>
      <h3 class="block-title">Избранные шаблоны</h3>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden"></div>
  </section>

  <!-- ===== Страница 2: Редактор ===== -->
  <section id="page-editor" class="page">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="cv" width="1800" height="1800"></canvas>
      <div id="crop-bar" class="crop-bar hidden">
        <span>Выдели пальцем нужную часть картинки (тяни за углы или рамку)</span>
        <button class="btn small" id="crop-square">Квадрат</button>
        <button class="btn small" id="crop-cancel">Отмена</button>
        <button class="btn small accent" id="crop-apply">Вырезать</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn" id="add-text">＋ Текст</button>
      <button class="btn" id="crop-btn">✂ Обрезать</button>
      <button class="btn" id="fit-btn">Вписать</button>
      <button class="btn" id="fill-btn">Заполнить</button>
      <label class="btn">📷 Картинка<input id="upload2" type="file" accept="image/*" hidden></label>
      <button class="btn" id="new-btn">Новый</button>
    </div>

    <details class="panel" id="size-panel">
      <summary>Размер холста: <b id="size-label">1:1 · 1800×1800</b></summary>
      <div class="row">
        <label>Пропорции
          <select id="aspect">
            <option value="1:1" selected>1:1 (квадрат)</option>
            <option value="4:5">4:5</option>
            <option value="3:4">3:4</option>
            <option value="9:16">9:16 (сторис)</option>
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
            <option value="img">Как у картинки</option>
          </select>
        </label>
        <label>Разрешение (длинная сторона)
          <select id="res">
            <option>1080</option><option>1440</option><option selected>1800</option><option>2160</option><option>3000</option>
          </select>
        </label>
        <label>Фон <input type="color" id="bg" value="#ffffff"></label>
      </div>
      <div class="row">
        <label class="grow">Масштаб картинки <input type="range" id="img-scale" min="10" max="400" value="100"></label>
      </div>
    </details>

    <div class="panel" id="text-panel">
      <div class="hint" id="text-hint">Нажми «＋ Текст», затем двигай блок пальцем. Двумя пальцами — размер и поворот.</div>
      <div id="text-controls" class="hidden">
        <textarea id="t-text" rows="2" placeholder="Текст"></textarea>
        <div class="row">
          <label class="grow">Шрифт
            <select id="t-font">
              <option value='Impact, "Oswald"'>Мемный (Impact)</option>
              <option value='"Oswald"'>Oswald</option>
              <option value='"Russo One"'>Russo One</option>
              <option value='"Rubik Mono One"'>Rubik Mono</option>
              <option value='"Roboto"'>Roboto</option>
              <option value='"PT Serif"'>PT Serif</option>
              <option value='"Lobster"'>Lobster</option>
              <option value='"Pacifico"'>Pacifico</option>
              <option value='"Comfortaa"'>Comfortaa</option>
              <option value='"Caveat"'>Caveat (рукописный)</option>
              <option value='"Press Start 2P"'>Пиксельный</option>
              <option value='Arial'>Arial</option>
              <option value='"Comic Sans MS", "Comfortaa"'>Comic Sans</option>
            </select>
          </label>
          <label>Цвет <input type="color" id="t-color" value="#ffffff"></label>
          <label>Обводка <input type="color" id="t-stroke" value="#000000"></label>
        </div>
        <div class="row">
          <label class="grow">Размер <span id="t-size-v"></span><input type="range" id="t-size" min="20" max="500" value="140"></label>
          <label class="grow">Толщина обводки <input type="range" id="t-sw" min="0" max="40" value="10"></label>
        </div>
        <div class="row">
          <label class="grow">Ширина блока <input type="range" id="t-maxw" min="10" max="100" value="92"></label>
          <label class="grow">Поворот <input type="range" id="t-rot" min="-180" max="180" value="0"></label>
        </div>
        <div class="row chips">
          <button class="chip" id="t-bold"><b>Ж</b></button>
          <button class="chip" id="t-italic"><i>К</i></button>
          <button class="chip" id="t-upper">АА</button>
          <button class="chip" id="t-align" title="Выравнивание">≡ центр</button>
          <button class="chip" id="t-bgon">Плашка</button>
          <input type="color" id="t-bgcolor" value="#000000" title="Цвет плашки">
          <label class="mini">Прозр. <input type="range" id="t-opacity" min="10" max="100" value="100"></label>
        </div>
        <div class="row chips">
          <button class="chip" id="t-top">Наверх</button>
          <button class="chip" id="t-bottom">Вниз</button>
          <button class="chip" id="t-center">Центр</button>
          <button class="chip" id="t-dup">Копия</button>
          <button class="chip danger" id="t-del">Удалить</button>
        </div>
      </div>
    </div>

    <div class="save-row">
      <button class="btn accent" id="save-db">💾 Сохранить на сайте</button>
      <button class="btn accent" id="save-jpg">⬇ JPEG на телефон</button>
      <button class="btn hidden" id="share-jpg">↗ Поделиться</button>
    </div>
  </section>
</main>

<nav class="bottom">
  <button class="nav active" data-page="memes">🖼<span>Мемы</span></button>
  <button class="nav" data-page="editor">✏️<span>Редактор</span></button>
</nav>

<div id="viewer" class="modal hidden">
  <div class="modal-box">
    <img id="viewer-img" alt="">
    <div class="row chips center">
      <button class="chip" id="v-edit">Редактировать</button>
      <button class="chip" id="v-dl">⬇ JPEG</button>
      <button class="chip danger" id="v-del">Удалить</button>
      <button class="chip" id="v-close">Закрыть</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/db.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
