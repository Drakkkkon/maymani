<style>
/* Раскладка: широкая надпись-заголовок на всю ширину, ниже одна колонка: последняя сборка, список архивов, журнал изменений.
   Цвета и формы — как в теме «Android» самого приложения (Material 3, вариант «Лаванда»). */
:root {
  --bg: #fef7ff; --fg: #1d1b20; --muted: #49454f; --line: #cac4d0;
  --primary: #6750a4; --on-primary: #ffffff; --pc: #eaddff; --on-pc: #21005d;
  --sc: #e8def8; --on-sc: #1d192b; --s1: #f7f2fa; --s2: #f3edf7; --s3: #ece6f0;
  --ok: #146c2e; --ok-bg: #d8f3dc;
  --font: 'Google Sans Flex', 'Roboto Flex', 'Roboto', 'Noto Sans', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1); --spring: cubic-bezier(.34, 1.45, .55, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --line: #49454f;
    --primary: #d0bcff; --on-primary: #381e72; --pc: #4f378b; --on-pc: #eaddff;
    --sc: #4a4458; --on-sc: #e8def8; --s1: #1d1b20; --s2: #211f26; --s3: #2b2930;
    --ok: #86d99a; --ok-bg: #14361f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --line: #49454f;
  --primary: #d0bcff; --on-primary: #381e72; --pc: #4f378b; --on-pc: #eaddff;
  --sc: #4a4458; --on-sc: #e8def8; --s1: #1d1b20; --s2: #211f26; --s3: #2b2930;
  --ok: #86d99a; --ok-bg: #14361f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { width: 100%; max-width: 1000px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 10px; }

/* ---- Шапка: большая надпись ---- */
.hero { position: relative; overflow: hidden; padding-block: clamp(28px, 6vw, 64px) clamp(24px, 4vw, 40px); }
.hero::before { /* крупная «лепёшка» фирменной формы Material 3 позади надписи */
  content: ""; position: absolute; width: min(78vw, 640px); aspect-ratio: 1; right: -14vw; top: -12vw; border-radius: 38%; background: var(--pc); opacity: .65; transform: rotate(14deg); z-index: 0;
}
.hero .wrap { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 12px; margin: 0 0 clamp(8px, 2vw, 20px); color: var(--muted); font-size: 15px; font-weight: 500; }
.brand img { width: 44px; height: 44px; border-radius: 14px; display: block; }
.word { margin: 0; font-weight: 700; font-size: clamp(3.2rem, 18vw, 12.5rem); line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
.word .w1 { color: var(--primary); }
.lead { max-width: 34em; margin: clamp(14px, 2.5vw, 26px) 0 0; font-size: clamp(1.05rem, 2.6vw, 1.35rem); line-height: 1.4; color: var(--muted); text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: clamp(16px, 3vw, 28px) 0 0; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 12px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500; text-decoration: none; }
.chip.is-line { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.chip.is-ok { background: var(--ok-bg); color: var(--ok); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* ---- Разделы ---- */
section { padding-block: clamp(22px, 4vw, 40px) 0; }
h2 { margin: 0 0 14px; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 600; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.sub { margin: -6px 0 18px; color: var(--muted); max-width: 42em; }

/* Кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; background: var(--sc); color: var(--on-sc);
  transition: border-radius .28s var(--spring), box-shadow .2s var(--ease), transform .2s var(--ease); }
.btn:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 9%, transparent); }
.btn:active { border-radius: 16px; }
.btn.is-main { background: var(--primary); color: var(--on-primary); }
.btn.is-ghost { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--line); }
.btn[aria-busy="true"] { opacity: .65; pointer-events: none; }
.btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }

/* Последняя сборка */
.latest { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: clamp(20px, 4vw, 44px); padding: clamp(22px, 4vw, 40px); border-radius: 36px; background: var(--pc); color: var(--on-pc); }
.latest h2 { margin-bottom: 6px; font-size: clamp(1.9rem, 5vw, 2.8rem); }
.latest .tag { margin: 0 0 10px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.latest .meta { margin: 0 0 22px; font-size: 15px; opacity: .85; }
.latest .meta code { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.latest .acts { display: flex; flex-wrap: wrap; gap: 10px; }
.latest .btn.is-ghost { color: var(--on-pc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-pc) 40%, transparent); }
.latest h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.latest ul { margin: 0; padding-left: 1.15em; display: grid; gap: 8px; font-size: 15px; line-height: 1.45; }
.latest li::marker { color: var(--primary); }
.latest > * { min-width: 0; }

/* Список архивов */
.arch { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; padding: 14px 16px 14px 20px; background: var(--s2); border-radius: 8px; }
.row:first-child { border-radius: 28px 28px 8px 8px; }
.row:last-child { border-radius: 8px 8px 28px 28px; }
.row:only-child { border-radius: 28px; }
.row .v { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.row .f { min-width: 0; }
.row .f b { display: block; font-weight: 500; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.row .f span { display: block; margin-top: 2px; color: var(--muted); font-size: 13.5px; }
.row .a { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.row .btn { min-height: 44px; padding: 0 18px; }
.drive { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; padding: 12px 16px; border-radius: 20px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); font-size: 14.5px; color: var(--muted); }
.drive b { color: var(--fg); font-weight: 600; }
.drive .btn { min-height: 44px; padding: 0 20px; }
.drive .msg { flex: 1 1 100%; font-size: 14px; color: var(--muted); }
.drive .msg[data-k="err"] { color: #b3261e; }
:root[data-theme="dark"] .drive .msg[data-k="err"] { color: #f2b8b5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .drive .msg[data-k="err"] { color: #f2b8b5; } }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
.shots figure { margin: 0; min-width: 0; }
.shots a { display: block; border-radius: 16px; overflow: hidden; background: var(--s2); box-shadow: inset 0 0 0 1px var(--line); }
.shots img { display: block; width: 100%; height: 340px; object-fit: contain; object-position: top center; background: var(--s2); }
.shots figcaption { margin: 6px 4px 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
@media (min-width: 900px) { .shots { grid-template-columns: repeat(2, minmax(0, 300px)); } .shots img { height: 380px; } }
.grp { list-style: none; margin: 22px 0 8px; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grp:first-child { margin-top: 0; }
.row .f .warn { display: block; margin-top: 4px; font-size: 12.5px; line-height: 1.4; color: #8a5300; }
:root[data-theme="dark"] .row .f .warn { color: #ffb95c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .row .f .warn { color: #ffb95c; } }
.pill.is-warn { background: color-mix(in srgb, #b3261e 14%, transparent); color: #b3261e; }
:root[data-theme="dark"] .pill.is-warn { color: #f2b8b5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.is-warn { color: #f2b8b5; } }
.dst { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--muted); }
.dst .chip { margin: 0; }
.note { margin: 14px 4px 0; color: var(--muted); font-size: 14px; max-width: 46em; }


/* Другие приложения */
.apps { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.app { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; padding: 14px 18px; background: var(--s2); border-radius: 28px; text-decoration: none; color: var(--fg); }
.app:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--fg) 6%, transparent); }
.app img { width: 56px; height: 56px; border-radius: 16px; display: block; }
.app .at { min-width: 0; display: block; }
.app .at b { display: block; font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
.app .at span { display: block; color: var(--muted); font-size: 14px; }
.app .go { color: var(--primary); font-weight: 600; font-size: 15px; white-space: nowrap; }
@media (max-width: 760px) { .app { grid-template-columns: 48px minmax(0, 1fr); } .app img { width: 48px; height: 48px; } .app .go { grid-column: 1 / -1; } }

/* Журнал изменений */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; border-radius: 16px; background: var(--s3); box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .2s var(--ease); }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
.search svg { width: 22px; height: 22px; fill: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; }
.search input::placeholder { color: var(--muted); opacity: .85; }
.count { color: var(--muted); font-size: 14px; }
.log { display: grid; gap: 3px; margin: 0; padding: 0; }
details.rel { background: var(--s2); border-radius: 8px; }
details.rel:first-child { border-radius: 24px 24px 8px 8px; }
details.rel:last-child { border-radius: 8px 8px 24px 24px; }
details.rel:only-child { border-radius: 24px; }
details.rel[open] { background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); }
details.rel summary { display: grid; grid-template-columns: 6rem minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 14px 18px 14px 20px; cursor: pointer; list-style: none; border-radius: inherit; }
details.rel summary::-webkit-details-marker { display: none; }
details.rel summary:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--fg) 6%, transparent); }
.rel .rv { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.rel .rn { color: var(--muted); font-size: 14.5px; min-width: 0; }
.rel .rt { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 8px; background: var(--sc); color: var(--on-sc); font-size: 12.5px; font-weight: 600; }
.pill.is-cur { background: var(--primary); color: var(--on-primary); }
.chev { width: 22px; height: 22px; fill: var(--muted); transition: transform .25s var(--ease); flex: none; }
details[open] .chev { transform: rotate(180deg); }
.rel .body { padding: 2px 20px 18px calc(20px + 6rem + 14px); }
.rel .body ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; max-width: 62em; }
.rel .body li { text-wrap: pretty; }
.rel .body li::marker { color: var(--primary); }
.empty { padding: 24px; border-radius: 24px; background: var(--s2); color: var(--muted); text-align: center; }

footer { padding-block: clamp(28px, 5vw, 56px) max(32px, env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; }
footer p { margin: 0; max-width: 46em; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none; max-width: min(92vw, 460px); padding: 14px 20px; border-radius: 16px; background: var(--fg); color: var(--bg); font-size: 14.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .25s var(--ease), transform .3s var(--spring); z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .latest { grid-template-columns: 1fr; border-radius: 28px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; padding: 16px 16px 16px 18px; }
  .row .v { grid-column: 1 / -1; }
  .row .a { grid-column: 1 / -1; justify-content: stretch; }

  .rel .rt { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; align-items: center; }
  .rel .rt .chev { margin-left: auto; }
  .rel .body { padding-left: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; scroll-behavior: auto !important; } }

<script type="application/json" id="releases">{"app": "My Money", "drive": {"status": "connected", "folder_name": "МайМани", "folder_id": "1_d8Jh8lwrvkQAbSxkxoCZcSa16lGcpkn", "folder_url": "https://drive.google.com/drive/folders/1_d8Jh8lwrvkQAbSxkxoCZcSa16lGcpkn"}, "releases": [{"version": "4.8.1", "name": "Экстра", "date": "2026-11-05", "items": ["Тема «Android»: подписи в кнопках уплотнены — слова больше не рвутся по буквам («Выгрузить за сегодня», «Проверить», «Доход», «Расход», «000»), при нехватке места подпись переносится по словам, а кнопки встают в новый ряд.", "Тема «Android»: выбор языка — список в стиле Android (плитки с кругом-кодом языка слева и круглым переключателем справа, выбранный язык залит цветом); плитки шрифтов, строка «время списания», валюта рядом с суммой, плитки категорий и выпадающие списки «Для чеков / Для обложек книг» теперь показывают текст целиком.", "Короче названия: «Авто (лучший из доступных)» → «Авто (лучший)», подсказка «Ключ (API key) — общий с распознаванием фото» → «Ключ (API key) — общий» (во всех темах).", "По файлам архива, относительно 4.8.0: файлов в сборке: 70 (в 4.8.0 было 70); изменено 8 (README_FIX_RU.txt, css/android.css, index.html, js/admin.js, js/android.js, js/recognize.js и ещё 2)."], "archive": {"file": "archives/Money_v4.8.1_Site.zip", "name": "Money_v4.8.1_Site.zip", "size": 686042, "sha256": "618687819837646985017026b08769315a856dc1243a8ae537dfe348fcbeef58"}, "time": null, "group": "site", "shots": [{"src": "shots/v4.8.1-1.jpg", "cap": "Плотные подписи в кнопках"}, {"src": "shots/v4.8.1-2.jpg", "cap": "Выбор языка в стиле Android"}]}, {"version": "4.8.0", "name": "Экстра", "date": "2026-11-03", "items": ["Новая тема «Android» в стиле современного Android (Material 3 Expressive / Material You): Настройки → Темы оформления → папка «Android». Пять вариантов: «Лаванда», «Океан», «Мята» (светлые), «Закат» и «Ночная роза» (тёмные). Основные темы не изменены.", "Тональные карточки без рамок и крупные скругления, меню-«пилюля» с индикатором активного пункта (боковое и нижнее), поля ввода с рамкой-акцентом при вводе, переключатели Material с кружком и галочкой, плавающая кнопка синхронизации, «стеклянное» нижнее меню и диалоги, волны-отклик при нажатии.", "Заставка и ПИН-код — как экран блокировки Android: крупные часы и круглые кнопки. Шрифт Google Sans Flex (Настройки → шрифты, группа «Android»), свои звуки «Android». Кнопка размера блока и меню размера нарисованы в этом стиле.", "Цвета любого варианта можно менять в «Создать тему на основе текущей»: производные оттенки пересчитываются сами.", "По файлам архива, относительно 4.7.0: файлов в сборке: 70 (в 4.7.0 было 68); добавлено 2 (css/android.css, js/android.js); изменено 7 (README_FIX_RU.txt, index.html, js/admin.js, js/fonts.js, js/sound.js, js/themes.js и ещё 1)."], "archive": {"file": "archives/Money_v4.8.0_Site.zip", "name": "Money_v4.8.0_Site.zip", "size": 682049, "sha256": "bbbd202f98e3ef9cb9b85fc36abc7f72195ad949de5f8f2d29a876c8919175cf"}, "time": "19:01", "group": "site", "shots": [{"src": "shots/v4.8.0-1.jpg", "cap": "Тема «Android»"}, {"src": "shots/v4.8.0-2.jpg", "cap": "Темы оформления: Android"}]}, {"version": "4.7.0", "name": "Экстра", "date": "2026-11-03", "items": ["Тема «Windows 95_Пуск» (и папка «Windows 95_Экстра»): у блоков внутри страниц больше нет синей панели с кнопками «закрыть», «развернуть», «на Стену». Вместо неё у каждого окна наверху меню в стиле Windows 95 — «Файл», «Правка», «Вид», «Блоки». Нажатие открывает меню: «Файл» — «Добавить новое значение…» (новая запись, подписка, цель и т. д. — зависит от страницы), «Добавить блок на рабочий стол», «Закрыть окно»; «Правка» — «Изменить размер» (маленький, средний, большой, авто — для одного блока или для всех); «Вид» — масштаб, «Развернуть» и «Свернуть» окно; «Блоки» — список блоков страницы: открыть в окне, перейти к блоку, свернуть / развернуть, повесить на Стену, значок на рабочем столе. Меню работает и с клавиатуры: Alt + первая буква, стрелки, Enter, Esc.", "Меню «Пуск»: нажатие на страницу открывает диалоговое окно-табличку — слева значок и название блока, справа размер и кнопка «+ На стол». Нажатие на блок открывает в отдельном окне только этот блок, а не всю страницу. Страницу целиком открывает кнопка «Вся страница».", "На панели задач справа, рядом с «Свернуть все», появились время и дата (Алматы, 24 часа). При наведении или долгом нажатии — день недели и секунды.", "Во всех окнах в правом нижнем углу — кнопка с лупой: масштаб в свободном стиле (50–200 %, шаг 5, кнопки «−» и «+»), «100 %» и «Под экран» — масштаб подбирается по ширине экрана устройства и пересчитывается при повороте. У каждого окна масштаб свой, он запоминается на устройстве.", "Отдельный блок можно положить на рабочий стол значком со стрелкой-ярлыком: через меню окна, таблицу блоков в «Пуске» или правой кнопкой / долгим нажатием на значок. Все значки (страниц и блоков) можно свободно перетаскивать по столу; положение запоминается. Правая кнопка на столе: «Упорядочить значки», «Обои рабочего стола…», «Свернуть все окна». Значок блока убирается клавишей Delete или через его меню.", "Остальные темы не изменены.", "По файлам архива, относительно 4.6.0: файлов в сборке: 68 (в 4.6.0 было 65); добавлено 3 (js/desk95-desktop.js, js/desk95-menu.js, js/desk95-tools.js); изменено 6 (README_FIX_RU.txt, css/desk95.css, index.html, js/admin.js, js/desk95.js, sw.js)."], "archive": {"file": "archives/Money_v4.7.0_Site.zip", "name": "Money_v4.7.0_Site.zip", "size": 671486, "sha256": "b24be58bc78c8428f65b24495d2965fc84b78cd7ab731aa8d3f899e17ffa0c2a"}, "time": "15:11", "group": "site", "shots": [{"src": "shots/v4.7.0-1.jpg", "cap": "Тема «Windows 95_Пуск»: окна"}, {"src": "shots/v4.7.0-2.jpg", "cap": "Раздел «Цели»"}]}, {"version": "4.6.0", "name": "Экстра", "date": "2026-11-03", "items": ["Тема «Windows 95_Пуск» переехала в новую папку «Windows 95_Экстра» (Настройки → Темы оформления). В папке ещё пять мягких тем без контрастных схем: «Экстра: Облака», «Мята», «Персик», «Лаванда» и «Туман» — у каждой свои цвета, обои и звуки.", "Внизу экрана появилась панель задач как в Windows 95. Слева кнопка «Пуск»: меню с основными страницами; нажатие на страницу открывает диалоговое окно — «папку» с блоками этой страницы, нажатие на блок открывает страницу и показывает блок.", "Каждая открытая страница — квадратная иконка без подписи на панели задач: нажатие сворачивает окно или возвращает его. Название страницы появляется при наведении мыши или при долгом нажатии пальцем. Справа на панели — кнопка «Свернуть все».", "Страницы в этой теме переписаны: блока с балансом, датой и временем больше нет, блоки выглядят как окна обычных программ на сером рабочем поле.", "Настройки → «Обои рабочего стола» (видно только в этих темах): кнопка «Изменить обои» открывает окно «Свойства: Экран» с 18 классическими обоями Windows 95, нарисованными заново.", "Внизу Настроек — название версии и год обновления. Остальные темы не изменены.", "По файлам архива, относительно 4.5.0: файлов в сборке: 65 (в 4.5.0 было 63); добавлено 2 (css/v46.css, js/desk95-walls.js); изменено 9 (README_FIX_RU.txt, css/desk95.css, index.html, js/admin.js, js/desk95-icons.js, js/desk95.js и ещё 3)."], "archive": {"file": "archives/Money_v4.6.0_Site.zip", "name": "Money_v4.6.0_Site.zip", "size": 644386, "sha256": "1b2a90c63cce6a3adf9e5c986b994bb35347b845cafc53041de37a0c36b63b88"}, "time": "14:32", "group": "site", "shots": [{"src": "shots/v4.6.0-1.jpg", "cap": "Тема «Экстра: Облака»"}, {"src": "shots/v4.6.0-2.jpg", "cap": "Папка «Windows 95_Экстра»"}]}, {"version": "4.5.0", "name": "", "date": "2026-11-03", "items": ["Новая тема «Windows 95_Пуск» (Настройки → Темы оформления → Windows 95). После заставки и ПИН-кода открывается пустой рабочий стол без панели «Пуск»: на нём значки разделов в стиле Windows 95 — Записи, Стена, Подписки, Зарплата, Статистика, Отчёты, Цели, Котировки, Цены, Настройки.", "Нажатие на значок с анимацией открывает страницу сайта в окне — в том же виде, что и обычно. Крестик в заголовке закрывает окно. На компьютере окна можно двигать, разворачивать и держать несколько сразу.", "Круглая кнопка «Обновить» внизу справа в этой теме заменена квадратной кнопкой «Свернуть все»: все открытые окна сворачиваются, и вы попадаете на рабочий стол. Вернуть окно — нажатием на его значок.", "Остальные темы не изменены. Тему можно включать и выключать на лету — открытая страница не пропадает.", "По файлам архива, относительно 4.4.0: файлов в сборке: 63 (в 4.4.0 было 60); добавлено 3 (css/desk95.css, js/desk95-icons.js, js/desk95.js); изменено 6 (README_FIX_RU.txt, index.html, js/admin.js, js/scrollbars.js, js/themes.js, sw.js)."], "archive": {"file": "archives/Money_v4.5.0_Site.zip", "name": "Money_v4.5.0_Site.zip", "size": 623924, "sha256": "ff456e39c8f6f7521390200030ff889dcdd97ca26ae0f0eced3f9fbad41765c2"}, "time": "14:03", "group": "site", "shots": [{"src": "shots/v4.5.0-1.jpg", "cap": "Тема «Windows 95_Пуск»"}, {"src": "shots/v4.5.0-2.jpg", "cap": "Темы оформления"}]}, {"version": "4.4.0", "name": "", "date": "2026-11-03", "items": ["Oldbook (семейная книга доходов и расходов) вынесен из сайта в отдельное приложение «Oldbook 95» — своя папка, свои скрипты, только оформление Windows 95. Из меню и сайта раздел убран.", "Каталог OldBook.kz остался: теперь это постоянный блок на «Стене» (виден администратору). Поиск по номеру, по фото обложки и по названию работает как раньше.", "Прежние записи Oldbook никуда не делись: они остаются в браузере и в файле на Google Диске и переносятся в Oldbook 95 через «Файл → Импорт».", "По файлам архива, относительно 4.3.0: файлов в сборке: 60 (в 4.3.0 было 60); добавлено 1 (js/dialogs.js); удалено 1 (js/oldbook.js); изменено 24 (ADMIN_SETUP_RU.txt, DEPLOY_RU.txt, README_FIX_RU.txt, css/aqua.css, css/custom.css, css/ios6.css и ещё 18)."], "archive": {"file": "archives/Money_v4.4.0_Site.zip", "name": "Money_v4.4.0_Site.zip", "size": 604204, "sha256": "143a6345fecc05eeec081e057ecd12f326f4b52a53b6ffc84b8061cbad3c198a"}, "time": "13:22", "group": "site", "shots": [{"src": "shots/v4.4.0-1.jpg", "cap": "Главный экран"}, {"src": "shots/v4.4.0-2.jpg", "cap": "Пункты меню (без Oldbook)"}]}, {"version": "4.3.0", "name": "", "date": "2026-11-03", "items": ["Голосовой ввод переделан: теперь у него несколько голосовых помощников на выбор — по образцу распознавания фото. ИИ (Gemini слышит запись и сразу отдаёт текст, сумму, категорию, тип и день), веб-сервисы (Groq Whisper, OpenAI, Google Cloud Speech-to-Text), встроенное распознавание браузера и Whisper на устройстве (работает без интернета после загрузки модели). «Авто» пробует по порядку и при сбое переходит к следующему. Выбор — в «Новой записи» и в Настройках → «Голосовой ввод»; ключи Gemini и OpenAI общие с распознаванием фото.", "Запись звука с индикатором уровня и автоматической остановкой, когда вы замолчали; языки речи: русский, казахский, английский, французский, немецкий; сумма словами по-русски, по-казахски и по-английски (раньше не понимались числа 11–19), несколько чисел во фразе, валюта («пять долларов»), день («вчера», «позавчера»).", "Распознанную фразу можно исправить прямо в результате — сумма и категория пересчитаются. «Уточнять фразу ИИ» (Gemini, Claude или OpenAI) точнее находит категорию и тип. В Настройках есть проверка помощника и сравнение всех помощников на одной записи.", "Новая тема «iOS 6» (папка «iOS») — светлая с глянцевыми синими панелями и полосатым фоном «Настроек» и тёмная «лён»: сгруппированные таблицы, переключатели ВКЛ/ВЫКЛ, чёрная глянцевая панель вкладок, заставка и ПИН-код в виде экрана блокировки. Все прежние темы остались как были.", "По файлам архива, относительно 4.2.0: файлов в сборке: 60 (в 4.2.0 было 57); добавлено 3 (css/ios6.css, css/v43.css, js/voiceengines.js); изменено 14 (README_FIX_RU.txt, admin_server/Code.gs, css/custom.css, index.html, js/admin.js, js/fonts.js и ещё 8)."], "archive": {"file": "archives/Money_v4.3.0_Site.zip", "name": "Money_v4.3.0_Site.zip", "size": 617224, "sha256": "59edb78b1873450b2de7f4a7c5a73e2c2337c656b610f882f1893edaf3ecaba3"}, "time": "10:51", "group": "site", "shots": [{"src": "shots/v4.3.0-1.jpg", "cap": "Главный экран"}, {"src": "shots/v4.3.0-2.jpg", "cap": "Голосовой ввод: помощники"}]}, {"version": "4.2.0", "name": "", "date": "2026-11-03", "items": ["Размер блока меняет и содержимое: маленький показывает только главное, средний — главное и кнопки, большой — всё. «Новая запись» переделана: сумма, плитки категорий, ряд значков (голос, комментарий, доход, расход) и цифровая клавиатура.", "По файлам архива, относительно 4.1.2: файлов в сборке: 57 (в 4.1.2 было 57); изменено 9 (README_FIX_RU.txt, css/v41.css, index.html, js/admin.js, js/emoji.js, js/oldbook.js и ещё 3)."], "archive": {"file": "archives/Money_v4.2.0_Site.zip", "name": "Money_v4.2.0_Site.zip", "size": 578872, "sha256": "13f18597bfe9b3bfc740d623547d417a1e26906b2c2e410fdcc9527e4ed96864"}, "time": "10:17", "group": "site", "shots": [{"src": "shots/v4.2.0-1.jpg", "cap": "Главный экран"}, {"src": "shots/v4.2.0-2.jpg", "cap": "Разметка и размеры блоков"}]}, {"version": "4.1.2", "name": "", "date": "2026-11-03", "items": ["В «Истории версий» показано, какая версия реально загружена на этом устройстве, и добавлена кнопка «Обновить сайт сейчас»: она сбрасывает старую копию сайта в телефоне и загружает свежие файлы (записи, настройки и ключи не удаляются).", "По файлам архива, относительно 4.1.1: файлов в сборке: 57 (в 4.1.1 было 57); изменено 5 (README_FIX_RU.txt, index.html, js/admin.js, js/script.js, sw.js)."], "archive": {"file": "archives/Money_v4.1.2_Site.zip", "name": "Money_v4.1.2_Site.zip", "size": 575378, "sha256": "0e6c0831204fc7e51e02214b13feb35693555e357499af0f781bec594779a49b"}, "time": "09:56", "group": "site", "shots": [{"src": "shots/v4.1.2-1.jpg", "cap": "Главный экран"}, {"src": "shots/v4.1.2-2.jpg", "cap": "История версий"}]}, {"version": "4.1.1", "name": "", "date": "2026-11-03", "items": ["Исправлено: после ввода ПИН-кода и ползунка «Разблокировать» на компьютере страница не реагировала на нажатия — невидимый экран ПИН-кода включался снова и закрывал всё. Теперь ПИН не запрашивается второй раз, а тающий экран не перехватывает нажатия.", "По файлам архива, относительно 4.1.0: файлов в сборке: 57 (в 4.1.0 было 57); изменено 5 (README_FIX_RU.txt, index.html, js/admin.js, js/script.js, sw.js)."], "archive": {"file": "archives/Money_v4.1.1_Site.zip", "name": "Money_v4.1.1_Site.zip", "size": 574269, "sha256": "47e0874bcaea546f3275f393d8c127dda6d459760ebb20255288d27da83604f5"}, "time": "09:45", "group": "site", "shots": [{"src": "shots/v4.1.1-1.jpg", "cap": "Заставка со слайдером"}, {"src": "shots/v4.1.1-2.jpg", "cap": "Ввод ПИН-кода"}]}, {"version": "4.1.0", "name": "", "date": "2026-11-03", "items": ["Распознавание фото: чек и обложка книги теперь читаются на выбор ИИ (Gemini, Claude, OpenAI — название, сумма и позиции сразу), веб-сервисом (Google Cloud Vision, OCR.space) или на устройстве (Tesseract, «точно» и «быстро»). Выбор — в блоке и в Настройках → «Распознавание фото»; «Авто» сам пробует по порядку, при сбое переходит к следующему способу. Есть проверка скорости. Ключи хранятся только на устройстве.", "На устройстве чек стал читаться лучше: выравнивание освещения (адаптивная чёрно-белая обработка) и режим построчного чтения.", "Размеры блоков: у каждого блока кнопка размера в заголовке — маленький 1×2, средний 2×2, большой 2×4 или «как было». Кнопка нарисована в стиле каждой темы (Windows 95, Аква, Аэро, 1-бит, Метро с неоном и леопардом).", "Администратор (Lego2009as@gmail.com): только ему виден раздел Oldbook и блок «Администратор: пользователи» в Настройках — список вошедших, их действия и то, что они вводят в поиск. Данные собираются только с согласия пользователя, отключаются в Настройках → «Журнал действий». Подключение — ADMIN_SETUP_RU.txt.", "По файлам архива, относительно 3.0.0: файлов в сборке: 57 (в 3.0.0 было 15); добавлено 43 (ADMIN_SETUP_RU.txt, admin_server/Code.gs, css/aqua.css, css/custom.css, css/features.css, css/layout.css и ещё 37); удалено 1 (js/config.js); изменено 7 (DEPLOY_RU.txt, README_FIX_RU.txt, index.html, js/cloud.js, js/script.js, manifest.webmanifest и ещё 1). Версий между 3.0.0 и 4.1.0 (3.1–4.0) в архивах нет, поэтому сравнение идёт через этот промежуток."], "archive": {"file": "archives/Money_v4.1.0_Site.zip", "name": "Money_v4.1.0_Site.zip", "size": 573563, "sha256": "d2abdd85b3469444449531c0a037c8bf1b0ac1e90a233247eb3afc594291b1b7"}, "time": "09:39", "group": "site", "shots": [{"src": "shots/v4.1.0-1.jpg", "cap": "Главный экран"}, {"src": "shots/v4.1.0-2.jpg", "cap": "Распознавание фото: выбор ИИ"}]}, {"version": "4.0.0", "name": "", "date": null, "items": ["Новый раздел «Стена»: любой блок из любой части программы выносится на стену булавкой в заголовке; на стене меняются ширина и высота блока (кнопками или за уголок), блок сворачивается и разворачивается на весь экран.", "Oldbook: первый блок — каталог OldBook.kz. Поиск книги по номеру, по фото обложки (название и автор распознаются) или по названию: обложка и корешок, автор, жанр, кратко о книге, цена и наличие, ссылки на поиск книги на Ozon и Wildberries, кнопка «Найти в Telegram» (скоро).", "Голосовой ввод в «Новой записи» (русский): из фразы берутся сумма, категория и комментарий.", "Фото чеков сохраняются на Google Диске в папках «Чеки / год / месяц / день», в истории — ссылка «Фото чека».", "Дореволюционный русский теперь со «старым слогом»: «казна», «прибытокъ», «издержки», «соизвольте нажать», «зѣло» и т. п."], "archive": null, "group": "site"}, {"version": "3.11.0", "name": "", "date": null, "items": ["Шрифты: 10 шрифтов — 3 общих для всех тем и свои у каждой группы тем; отдельно для заголовков и для текста. Загрузка своего шрифта с проверкой совместимости (русские, казахские, дореформенные буквы, латиница, цифры, ₸, ширина и высота).", "Языки: русский, русский дореформенный, английский, казахский, французский и немецкий — меню, кнопки, блоки, окна и сообщения.", "ПК: на экранах шире 16:9 приложение стоит по центру; блок «Разметка и меню» — ширина, блоки в строке, плотность.", "Экран приветствия с ползунком на ПК (баланс, траты за сегодня, главная цель); открывается и клавишей Enter.", "Меню-гамбургер ☰ (на телефоне и ПК) и меню слева на телефоне — на выбор вместо нижнего.", "Иконка приложения: своя картинка → файлы для GitHub одним ZIP и значок вкладки сразу."], "archive": null, "group": "site"}, {"version": "3.10.0", "name": "", "date": null, "items": ["Ползунок прокрутки справа по всей программе: у всей страницы и у всех длинных блоков. Тонкий, но легко ловится пальцем; в каждой теме — в её стиле.", "Новая папка тем «Windows 8 Метро»: плитки вместо меню, огромные тонкие заголовки разделов на полэкрана, плоские окна без рамок, экран блокировки с крупным временем, «поворот» плиток при переходе, свои звуки.", "10 вариантов «Метро»: кобальт, лайм, пурпур, малиновый, изумруд, манго, бирюза, светлая, неон (светящиеся плитки и заголовки) и леопард (пятнистый фон, звуки леопарда). Прежние темы не изменены."], "archive": null, "group": "site"}, {"version": "3.9.0", "name": "", "date": null, "items": ["Уведомления: напоминания о списании подписок (за неделю, 3 дня, день, 3 часа, час или в момент списания) — настраиваются у каждой подписки кнопкой 🔔; каждое утро в 9:00 «Доброе утро» с вашими целями.", "В 23:00 Excel и PDF с записями за день сохраняются в выбранную папку (Chrome/Edge на ПК) или в «Загрузки».", "Цели: список покупок — вписать или вставить сообщение, приложение само разбивает его на пункты; отметка «куплено» и цена у каждого пункта.", "Новый раздел «Цены»: как менялась цена товара за период, цены по магазинам, разные валюты, цена за 1 кг / 1 л. Цены попадают сюда из списка покупок и из чеков по фото.", "Новая запись: выбор валюты (тенге, доллар США, евро, рубль) с пересчётом в тенге по курсу.", "Статистика: блок «Мой банк» — остаток и траты по выписке PDF или уведомлению банка, предупреждения о низком остатке и крупных тратах."], "archive": null, "group": "site"}, {"version": "3.8.0", "name": "", "date": null, "items": ["Новый раздел «Котировки»: акции популярных компаний (США, Казахстан, мировые) с ценой, изменением за день и мини-графиком; «+ Добавить компанию» ищет любую компанию мира.", "Котировка акции в блоке баланса и пара котировок на заставке.", "Блок «Текущий баланс» настраивается: какие строки показывать и размер цифр и надписей (Настройки или кнопка в самом блоке).", "Цели переделаны: несколько приоритетных вещей по ссылке на товар (картинка, название и цена подгружаются), кнопка «$» — отложить сумму или списывать каждый день / неделю / месяц. Отложенное видно в «Записях» как «Приоритетная вещь: …».", "Чек по фото: камера над «Новой записью» распознаёт итог и покупки и сохраняет одну запись, покупки — в комментарии.", "Картинки категорий: выбор категории картинками в «Новой записи» и картинки в истории операций; в настройках — свои картинки и вид (картинки, текст или оба).", "У всех блоков работают кнопки окна: «_» сворачивает блок, «□» разворачивает его на весь экран с прокруткой. Длинные списки прокручиваются внутри блока.", "Звуки: кнопка «Мои звуки» со всеми добавленными звуками; звук можно выбрать для конкретной темы или для всех тем, всё хранится на Google Диске."], "archive": null, "group": "site"}, {"version": "3.7.0", "name": "", "date": null, "items": ["Новая тема «Аэро» в стиле Windows Vista: стеклянные окна с размытием и бликами, глянцевые кнопки, чёрная стеклянная панель задач, свои «воздушные» звуки.", "Темы разложены по папкам (Windows 95, Windows Vista, Mac OS и ваши папки). Папки нарисованы в стиле текущей темы и открываются с анимацией.", "Свои темы: на основе текущей можно поменять цвета фона, окон, кнопок, текста, полей, заголовков, выделения и сумм и сохранить тему в нужную папку (в том числе новую). Темы синхронизируются через Google.", "Свайп влево / вправо перелистывает разделы меню.", "Отчёты: блок «Загрузить свою таблицу» — Excel (.xlsx) или CSV; столбцы находятся автоматически, перед добавлением показывается предпросмотр.", "Главная: цифровая клавиатура для суммы под кнопками «Доход» и «Расход».", "Статистика: на ПК по два блока в строке; калькулятор и лента со всеми вычислениями.", "Oldbook: убран выбор «Катя / Папа / Саша». Новые записи подписываются владельцем книги, у старых записей имя сохранено."], "archive": null, "group": "site"}, {"version": "3.6.0", "name": "", "date": null, "items": ["Новая тема «Классика 1-бит» в духе самых первых чёрно-белых компьютеров: полосатые заголовки окон с квадратиками, жёсткие тени, рабочий стол из точек, строка меню вверху экрана на ПК, нажатие — «инверсия», свои пищащие звуки. Остальные темы не изменены."], "archive": null, "group": "site"}, {"version": "3.5.0", "name": "", "date": null, "items": ["Новая тема «Аква» по мотивам первой Mac OS X: полосатые окна, три цветных круга в заголовках, гелевые кнопки-таблетки, синий ползунок прокрутки, док внизу экрана на ПК, свои «стеклянные» звуки. Остальные темы не изменены."], "archive": null, "group": "site"}, {"version": "3.4.0", "name": "", "date": null, "items": ["Свои категории: добавление прямо из списка категорий («+ Добавить … в мои категории»), кнопка в Oldbook и блок «Мои категории» в настройках. Сохраняются в аккаунте Google.", "«Выбрать звуки»: свои файлы (MP3, WAV, OGG, M4A…) для открытия и закрытия приложения, кнопок, открытия и закрытия окошек, главного меню и прокрутки; можно выключить отдельный звук или вернуть звук темы. Файлы хранятся на Google Диске и синхронизируются.", "Новые звуки по умолчанию: кнопки главного меню, прокрутка, закрытие приложения.", "Полосы прокрутки в стиле Windows 95 во всех блоках с прокруткой — со стрелками и ползунком, который можно тянуть, в том числе на телефоне."], "archive": null, "group": "site"}, {"version": "3.3.0", "name": "", "date": null, "items": ["Исправлено: в установленном приложении открывалась старая копия страницы, из-за чего не работали слайдер разблокировки и остальное приложение.", "Запуск защищён: ошибка в одной части больше не останавливает слайдер, вход и меню.", "Вход через Google: точная подсказка, что не так с файлом js/config.js. Файл настроек больше не входит в архивы обновлений.", "19 тем оформления: схемы в духе Windows 95 (Стандартная, Кирпич, Пустыня, Баклажан, Сирень, Клён, Море, Слива, Тыква, Дождливый день, Красный-белый-синий, Роза, Сланец, Ель, Гроза, Бирюза, Пшеница), а также Леопард и Неон. Цвета смягчены.", "У каждой темы свои звуки: колокольчики, дерево, вода, дождь, гроза, синтезатор, фанфары; у Леопарда — рычание и лязг когтей, у Неона — искажённое гудение и «зипы»."], "archive": null, "group": "site"}, {"version": "3.2.0", "name": "", "date": null, "items": ["Комментарий к записи (до 100 символов): кнопка «Комментарий» в форме, текст курсивом под временем записи, колонка «Комментарий» в Excel и PDF.", "Новый раздел Oldbook: записи с выбором «Кто» (Катя, Папа, Саша), цифровая клавиатура для суммы без системной клавиатуры.", "Oldbook: список доходов и расходов с ограниченной высотой и кнопкой □ «развернуть на весь экран».", "Oldbook: статистика — кто сколько потратил, на что тратил каждый, доходы и расходы по людям, крупные траты с комментариями.", "Oldbook: совместный доступ между аккаунтами Google — владелец открывает доступ по email, получатель подтверждает; записи обновляются при синхронизации.", "Звуки интерфейса (щелчки, открытие и закрытие окон) и собственная мелодия при запуске, с выключением в настройках."], "archive": null, "group": "site"}, {"version": "3.1.0", "name": "", "date": null, "items": ["Новый дизайн в стиле Windows 95: бирюзовый «рабочий стол», серые объёмные окна с синими заголовками и кнопками «_ □ ×», вдавленные поля, «панель задач» внизу на телефоне.", "Пиксельный шрифт в заголовках, кнопках и меню; суммы, даты и время — чётким шрифтом.", "Диаграммы в палитре 16 цветов, доход зелёный, расход красный.", "Убраны прежние настройки оформления (тёмная тема, темы, фон шапки, шрифт, цвет текста) — дизайн теперь один."], "archive": null, "group": "site"}, {"version": "Виджет", "name": "My Money — виджет для Android", "date": "2026-11-01", "time": "11:03", "kind": "proj", "group": "other", "flag": null, "warn": null, "items": ["Проект Android Studio (Gradle, Kotlin): виджет главного экрана в стиле Windows 95 с балансом, лимитом, копилкой и именем, датой и временем Алматы (UTC+5), погодой и курсами тенге к $, € и ₽. Пакет kz.mymoney.widget.", "Данные берутся из файла my_money_data.json на Google Диске, который ведёт сайт My Money; курсы и погода загружаются из тех же источников, что и на сайте.", "Обновление: автоматически раз в 30 минут (минимум, который разрешает Android) и по кнопке на виджете.", "Сборка APK: GitHub Actions (файл .github/workflows/build.yml) при каждой загрузке файлов или вручную: Actions → Build widget APK → Run workflow. Готовый APK лежит в разделе Artifacts.", "Подпись: ключ берётся из секретов репозитория KEYSTORE_BASE64 и KEYSTORE_PASSWORD; без них при первой сборке ключ создаётся сам и выкладывается в отдельный архив, его нужно сохранить.", "В архиве 28 файлов: 5 классов (виджет, отрисовка, загрузка данных, фоновое обновление, стартовый экран) и ресурсы в стиле Windows 95 (рельефные и вдавленные рамки, заголовок окна). Скриншота нет: это исходный код, его нужно собрать."], "archive": {"file": "archives/MyMoney_Widget_GitHub.zip", "name": "MyMoney_Widget_GitHub.zip", "size": 24390, "sha256": "39663b236f2434b88271e0a8697260eb5dcb9825aed5d938ae92a085854fed5b"}}, {"version": "W95-3", "name": "Мои Финансы (Win95), полное меню", "date": "2026-11-01", "time": "05:04", "kind": "web", "group": "other", "flag": null, "warn": null, "items": ["Полное меню: вкладки «Главная», «История», «Графики» и «Настройки» переключаются; то же меню слева на ПК и внизу на телефоне.", "История: фильтры «Все», «Доходы», «Расходы». Настройки: выбор темы оформления (по умолчанию «Windows 95»), «Экспорт в Excel», «Очистить базу данных».", "Кнопки «Доход» и «Расход» пока только показывают сообщение вида «Доход … ₸ добавлен!», данные не сохраняются.", "Ввод ПИН-кода как в W95-2 (ровно 4 цифры). Это всё ещё макет интерфейса без настоящей логики учёта."], "archive": {"file": "archives/MyMoney_Win95_Full_Menu.zip", "name": "MyMoney_Win95_Full_Menu.zip", "size": 22528, "sha256": "7ba564027dd5a1f6dded1b4cc9ebb6675047b1caac27dbebbb74ec4f294357a1"}, "shots": [{"src": "shots/proto-win95-fullmenu-1.jpg", "cap": "Главная"}, {"src": "shots/proto-win95-fullmenu-2.jpg", "cap": "Настройки"}]}, {"version": "W95-2", "name": "Мои Финансы (Win95), исправленный", "date": "2026-11-01", "time": "05:01", "kind": "web", "group": "other", "flag": null, "warn": null, "items": ["Рабочий ввод ПИН-кода: точки закрашиваются по мере ввода, максимум 4 цифры, «C» очищает, «OK» принимает ровно 4 цифры, иначе сообщение «ПИН-код должен содержать ровно 4 цифры».", "Код не проверяется: в комментарии сказано, что в настоящем приложении будет сверка с Firebase.", "Кнопки нижнего и бокового меню подсвечивают активный пункт («Главная», «История», «Графики», «Профиль»), вкладки пока не переключаются."], "archive": {"file": "archives/MyMoney_Win95_Fixed.zip", "name": "MyMoney_Win95_Fixed.zip", "size": 17299, "sha256": "aa2bfc763308373a71a1bda1e132a8cf0fde64769f18c85890afbe4d2a90d8c5"}, "shots": [{"src": "shots/proto-win95-fixed-1.jpg", "cap": "Ввод ПИН-кода"}, {"src": "shots/proto-win95-fixed-2.jpg", "cap": "После ввода кода"}]}, {"version": "W95-1", "name": "Мои Финансы (Win95), макет", "date": "2026-11-01", "time": "04:59", "kind": "web", "group": "other", "flag": null, "warn": null, "items": ["Первый макет приложения «Мои Финансы» в стиле Windows 95: бирюзовый рабочий стол, серые рельефные окна, синие заголовки. Три файла: index.html, css, script.js.", "Экран ПИН-кода с четырьмя точками и клавиатурой 1–9, C, 0, OK; «OK» сразу открывает приложение, код не проверяется (скрипт — заглушка).", "Главный экран: баланс, форма «Новая операция» (сумма, категория, «Доход», «Расход») и блок «История» с примерами. Меню: «Главная», «История», «Графики», «Профиль»."], "archive": {"file": "archives/MyMoney_Win95.zip", "name": "MyMoney_Win95.zip", "size": 15651, "sha256": "89afa7a9c0716ac4972a9671fce6bb99682bb0f12e4fbc21665e5596ca08f0c4"}, "shots": [{"src": "shots/proto-win95-1.jpg", "cap": "Экран ПИН-кода"}, {"src": "shots/proto-win95-2.jpg", "cap": "Главный экран"}]}, {"version": "2.11.0", "name": "Win95-вариант", "date": "2026-11-01", "time": "04:49", "kind": "web", "group": "other", "flag": null, "warn": null, "items": ["Версия 2.11.0 сайта с пробным оформлением «Windows 95»: в index.html добавлен блок стилей «WINDOWS 95 THEME OVERRIDE» (около 110 строк): бирюзовый фон (#008080), серые рельефные окна (#c0c0c0), шрифт MS Sans Serif / Tahoma.", "Остальной код (css и js) совпадает с обычной 2.11.0: выгрузка PDF формата A4 через pdfmake, удалена кнопка «Скачать для Apple Pages», боковое меню по левому краю, нижнее меню сеткой 4×2.", "Предшественник оформления Windows 95 из версии 3.1.0: здесь стиль ещё накладывается поверх обычного интерфейса, а не оформлен как тема."], "archive": {"file": "archives/Money_v2.11.0_Win95.zip", "name": "Money_v2.11.0_Win95.zip", "size": 193490, "sha256": "f3951ec834611d245e7a9e3c376d4fc59956bf0acef6b1733bd6a7d762cc1aee"}, "shots": [{"src": "shots/v2.11.0-win95-1.jpg", "cap": "Главный экран в стиле Windows 95"}, {"src": "shots/v2.11.0-win95-2.jpg", "cap": "Настройки"}]}, {"version": "3.0.0", "name": "", "date": "2026-11-01", "items": ["Приложение стало сайтом (GitHub Pages): обновляется само, ставится на телефон с главного экрана, работает без интернета.", "Вход через Google, все данные хранятся на вашем Google Диске (папка «My Money») и автоматически синхронизируются между устройствами.", "Перенос данных из старого аккаунта (вход по email) в настройках.", "Блок «Профиль»: имя пользователя сохраняется в аккаунте, показывается в приветствии и в PDF.", "Выгрузки называются дата_время_имя, например 2026-11-01_14-30_Айдар.xlsx."], "archive": {"file": "archives/Money_v3.0.0_Site.zip", "name": "Money_v3.0.0_Site.zip", "size": 95500, "sha256": "ad8d6798414d0ade7425aa88f0450a41c969ec4ca65d4072ba785660850912b6"}, "time": "09:52", "group": "site", "shots": [{"src": "shots/v3.0.0-1.jpg", "cap": "Главный экран"}, {"src": "shots/v3.0.0-2.jpg", "cap": "Вход через Google (Google Диск)"}]}, {"version": "2.12.0", "name": "", "date": "2026-10-31", "items": ["Выгрузка Excel, PDF и JSON в APK: приложение распознаёт встроенное окно Android и сразу показывает таблицу с копированием, без ложного «файл скачан».", "Копирование таблицы в APK срабатывает надёжно в момент нажатия.", "Поддержка нативного моста MoneyNative: если добавить его в исходники APK, файлы .xlsx, .pdf и .json сохраняются в «Загрузки» (инструкция ANDROID_EXPORT_BRIDGE_RU.txt).", "Android-сборка 2.12 (My_money_2.12.zip, WebIntoApp, пакет com.mycompany.mymoney) содержит код сайта 2.11: в названии страницы «My Money 2.11». Скриншоты сняты с этого кода."], "group": "site", "kind": "apk", "time": "10:16", "shots": [{"src": "shots/v2.12.0-apk-1.jpg", "cap": "Главный экран"}, {"src": "shots/v2.12.0-apk-2.jpg", "cap": "Отчёты: сводка по периодам"}], "held": "Архив не выложен в открытый доступ: внутри лежит ключ подписи Android-приложения и пароль к нему.", "held_name": "My_money_2.12.zip", "held_sha256": "70c15056188370b1d3bcdca568ad35b0b29486ec3640396e842286878dbf3882"}, {"version": "2.11.0", "name": "", "date": null, "items": ["Выгрузка в PDF формата A4: открывается на любом телефоне, планшете и ПК, подходит для печати. Кнопка есть в «Отчётах» и в окне таблицы.", "Убрана кнопка «Скачать для Apple Pages».", "Боковое меню на планшете и ПК выровнено по левому краю.", "Нижнее меню на телефоне в два ряда по сетке 4 колонки.", "В настройках блок «Пункты меню»: перетаскивание, скрытие ненужных пунктов и возврат плюсиком.", "Статистика: сводка за период и новые диаграммы (категории расходов, источники доходов, баланс за 30 дней, по месяцам, по дням недели, по времени суток)."], "archive": null, "group": "site"}, {"version": "2.10.0", "name": "", "date": null, "items": ["Все разделы оформлены едиными карточками, как «Настройки»: заголовки с иконками, одинаковые отступы, сетка на ПК, ровная колонка на телефоне.", "Вход по отпечатку: исправлена привязка и вход (сохраняется ключ отпечатка), проверка поддержки устройства и понятное объяснение, если обёртка приложения не даёт доступ к сканеру.", "Анимации нажатия кнопок и плавные переходы между разделами, каждая не дольше 0.5 секунды."], "archive": null, "group": "site"}, {"version": "2.9.0", "name": "", "date": null, "items": ["Выгрузка Excel работает на телефоне: меню «Поделиться», скачивание и просмотр таблицы с копированием в Excel / Google Таблицы, если приложение не может сохранить файл.", "Доход всегда зелёный, расход всегда красный во всех темах, шрифтах и цветах текста.", "В блоке «Текущий баланс» справа: дата, время, погода в Алматы и курсы тенге к доллару, евро и рублю.", "Время Алматы исправлено на UTC+5 (было на час вперёд).", "Поле «Новый ПИН» выглядит корректно с любым шрифтом.", "«Сбросить всё» показывает подробное предупреждение перед удалением.", "Добавлена эта история версий."], "archive": null, "group": "site"}, {"version": "2.8.2", "name": "", "date": null, "items": ["Архив для WebIntoApp: index.html лежит в корне ZIP."], "archive": null, "group": "site"}, {"version": "2.8.1", "name": "", "date": null, "items": ["Полностью убрано обновление свайпом сверху вниз (pull-to-refresh) на телефоне и ПК, в том числе в обёртке WebIntoApp."], "archive": null, "group": "site"}, {"version": "2.8.0", "name": "", "date": null, "items": ["Исправлена ошибка запуска скрипта (дублирование кода).", "Заставка: время, дата и погода Алматы с автообновлением.", "Новый слайдер «разблокируйте» для сенсорных экранов."], "archive": null, "group": "site"}, {"version": "1.6", "name": "Money 1.6 Subscriptions", "date": "2026-10-27", "time": "02:37", "kind": "web", "group": "early", "flag": "не запускается", "warn": null, "items": ["От «Money_1.6_Fixed» отличается одной строкой в подсветке активной вкладки; остальные файлы совпадают. Логотип (images/logo.png) подключён в разметке, но самого файла в архиве нет.", "В этой строке появилась вторая синтаксическая ошибка (лишняя скобка «']» вместо «')»), так что кроме регулярного выражения сломано и это место.", "Скрипт по-прежнему не запускается: исправить нужно обе ошибки."], "archive": {"file": "archives/Money_1.6_With_Logo_And_Subscriptions.zip", "name": "Money_1.6_With_Logo_And_Subscriptions.zip", "size": 11954, "sha256": "dfb475e332f4fa3f4bbfaf49b4600b2c55fd4d13761f1f4d2427e4c0e432788a"}, "shots": [{"src": "shots/e-m16l-1.jpg", "cap": "Страница при открытии"}, {"src": "shots/e-m16l-2.jpg", "cap": "Вкладка «Подписки» не открывается"}]}, {"version": "1.6", "name": "Money 1.6 Subscriptions", "date": "2026-10-27", "time": "02:34", "kind": "web", "group": "early", "flag": "не запускается", "warn": null, "items": ["Название «Money 1.6 Subscriptions»; добавлена функция запуска init и подсветка активной вкладки в меню по её кнопке.", "Поправлены стили бокового меню (убрана левая полоска у активного пункта) и круглые кнопки правки и удаления у записей и подписок.", "Известная ошибка остаётся: опечатка в регулярном выражении в очистке адреса базы (cleanUrl) не даёт скрипту запуститься."], "archive": {"file": "archives/Money_1.6_Fixed.zip", "name": "Money_1.6_Fixed.zip", "size": 11989, "sha256": "6eaf4c680471c89052139752266055dba1eb7adc82918486d4267aa23750f8f0"}, "shots": [{"src": "shots/e-m16f-1.jpg", "cap": "Страница при открытии"}, {"src": "shots/e-m16f-2.jpg", "cap": "Вкладка «Подписки» не открывается"}]}, {"version": "1.6", "name": "Money 1.6", "date": "2026-10-27", "time": "02:33", "kind": "web", "group": "early", "flag": "не запускается", "warn": null, "items": ["Та же облегчённая ветка, но номер в названии снова 1.6: «Money 1.6», в меню вкладка «Подписки» («Ежемесячные подписки и регулярные траты»).", "Кнопки «Отправить» и «Скачать» в настройках облака сразу запускают синхронизацию и показывают «Отправлено в облако!» или «Загружено из облака!».", "Уведомлений нет, скрипт около 19,5 КБ.", "Известная ошибка. В коде есть опечатка в регулярном выражении (удаление «/» в конце адреса базы), из-за чего скрипт не запускается: страница открывается, но ничего не работает. Исправляется одной строкой."], "archive": {"file": "archives/Money_1.6_Subscriptions.zip", "name": "Money_1.6_Subscriptions.zip", "size": 11273, "sha256": "a88b4da95d233a0e516a52fc30daee30d06409d64c65310aa22ec16501ddafed"}, "shots": [{"src": "shots/e-m16-1.jpg", "cap": "Страница при открытии"}, {"src": "shots/e-m16-2.jpg", "cap": "Вкладка «Подписки» не открывается"}]}, {"version": "1.7", "name": "Money 1.7 Subscriptions", "date": "2026-10-27", "time": "02:31", "kind": "web", "group": "early", "flag": "не запускается", "warn": null, "items": ["Облегчённая ветка кода: скрипт сильно сжат (около 16,6 КБ вместо 28,7 КБ), убраны комментарии и часть подсказок.", "Убраны уведомления («Превышен лимит!», «Перевод в копилку»), значок синхронизации и часть служебных функций; подпись «День списания в месяце» стала «День списания».", "Убран запрет обновления страницы свайпом вниз (overscroll-behavior): на телефоне страница может перезагружаться жестом.", "Известная ошибка. В коде есть опечатка в регулярном выражении (удаление «/» в конце адреса базы), из-за чего скрипт не запускается: страница открывается, но ничего не работает. Исправляется одной строкой."], "archive": {"file": "archives/Money_1.7_App.zip", "name": "Money_1.7_App.zip", "size": 10173, "sha256": "d86c2489f59c0e5149fb6dcbcc0abdfa2292f9f72996c956ca05a108c939a072"}, "shots": [{"src": "shots/e-m17-1.jpg", "cap": "Страница при открытии"}, {"src": "shots/e-m17-2.jpg", "cap": "Вкладка «Подписки» не открывается"}]}, {"version": "1.7", "name": "Money 1.7 Subscriptions", "date": "2026-10-27", "time": -сборка 1.2 (пакет com.mycompany.moneyver003) с кодом Money 1.3 Universal; веб-файлы совпадают с архивом Finance_App_V1_3_Universal.", "Относительно APK 1.1 добавлены облачная синхронизация, единый интерфейс для ПК и телефона и раздел «Локальные данные»."], "shots": [{"src": "shots/e-1.3-1.jpg", "cap": "Главный экран"}, {"src": "shots/e-1.3-2.jpg", "cap": "Настройки и облако"}], "held": "Архив не выложен в открытый доступ: внутри лежит ключ подписи Android-приложения и пароль к нему.", "held_name": "money_ver.003_1.2.zip", "held_sha256": "2f248c77c3b0794e9dcdf31dc59e2fc558d84454aebb361bf4f9fc159d53d4ca"}, {"version": "1.3", "name": "Money 1.3 Universal", "date": "2026-10-27", "time": "01:00", "kind": "web", "group": "early", "flag": null, "warn": null, "items": ["«Universal»: один интерфейс для компьютера и телефона. На ПК слева боковое меню, на телефоне вкладки внизу экрана.", "Облачная синхронизация через Firebase Realtime Database: в «Настройки & Облако» указываются «URL базы данных» и «Секретный ID», кнопки «Отправить» и «Скачать» передают данные между компьютером и телефоном.", "Раздел «Локальные данные»: резервная копия JSON («Скачать», «Загрузить файл») и «Сбросить всё».", "Раздел настроек стал «Настройки & Облако» (значок облака)."], "archive": {"file": "archives/Finance_App_V1_3_Universal.zip", "name": "Finance_App_V1_3_Universal.zip", "size": 11482, "sha256": "6e0b582f87c4874bfee790d96486d7ae2a07e26611dcdeb9e7e09d1ac650741f"}, "shots": [{"src": "shots/e-1.3-1.jpg", "cap": "Главный экран"}, {"src": "shots/e-1.3-2.jpg", "cap": "Настройки и облако"}]}, {"version": "1.2", "name": "Money 1.2", "date": "2026-10-27", "time": "00:53", "kind": "web", "group": "early", "flag": null, "warn": null, "items": ["Приложение получает имя «Money» и номер версии: «Money 1.2». В настройках надпись «Версия программы Money 1.2» и подпись «Создатель Google Gemini и Alexandr ❤️».", "Вкладка «Аналитика» заменена на «Отчёты»: «Сводка по периодам» с группировкой «По часам», «По дням <script>
(function () {
  var DATA = JSON.parse(document.getElementById('releases').textContent);
  var REL = DATA.releases, DRIVE = DATA.drive || {}, SA = !!DATA.standalone;
  var $ = function (s) { return document.querySelector(s); };
  var ICON_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>';
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtWhen(r) { return r.date ? fmtDate(r.date) + (r.time ? ', ' + r.time : '') : ''; }
  var KIND = { apk: 'Android APK', web: 'Веб', proj: 'Проект Android' };
  function plural(n, a, b, c) { var m = n % 100, k = n % 10; return n + ' ' + (m > 10 && m < 15 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c); }
  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(2).replace('.', ',') + ' МБ' : Math.round(n / 1024) + ' КБ'; }
  var RANK = { site: 0, other: 1, early: 2 };
  var withArch = REL.filter(function (r) { return r.archive; }).map(function (r, i) { return [r, i]; }).sort(function (a, b) { return (RANK[a[0].group] - RANK[b[0].group]) || (a[1] - b[1]); }).map(function (x) { return x[0]; });
  var cur = REL[0];
  var latest = withArch[0];

  function dlBtn(r, cls) {
    var a = r.archive;
    if (SA) return '<a class="btn ' + (cls || '') + '" href="' + esc(a.file) + '" download="' + esc(a.name) + '">' + ICON_DL + 'Скачать архив</a>';
    return '<button type="button" class="btn ' + (cls || '') + '" data-dl data-file="' + esc(a.file) + '" data-name="' + esc(a.name) + '" data-sha="' + esc(a.sha256) + '">' + ICON_DL + 'Скачать архив</button>';
  }

  /* Чипы под заголовком */
  var chips = ['<li class="chip">Версия ' + esc(cur.version) + (cur.name ? ' «' + esc(cur.name) + '»' : '') + '</li>'];
  if (cur.date) chips.push('<li class="chip is-line">Обновлено ' + esc(fmtDate(cur.date)) + '</li>');
  chips.push('<li class="chip is-line">' + plural(withArch.length, 'архив', 'архива', 'архивов') + ' · ' + plural(REL.length, 'запись', 'записи', 'записей') + ' в журнале</li>');
  if (DRIVE.status === 'connected') chips.push('<li><a class="chip is-ok" href="' + esc(DRIVE.folder_url || '#') + '" target="_blank" rel="noopener"><span class="dot"></span>Папка на Google Диске</a></li>');
  else chips.push('<li class="chip is-line"><span class="dot"></span>Google Диск: не подключён</li>');
  (DATA.apps || []).forEach(function (a) { chips.push('<li><a class="chip" href="' + esc(a.page) + '">' + esc(a.name) + ' ' + esc(a.version) + ' →</a></li>'); });
  $('#chips').innerHTML = chips.join('');

  /* Другие приложения */
  if ((DATA.apps || []).length) {
    $('#apps').innerHTML = '<h2 id="apps-h">Другие приложения</h2><ul class="apps">' + DATA.apps.map(function (a) {
      return '<li><a class="app" href="' + esc(a.page) + '"><img src="' + esc(a.icon) + '" alt="" width="56" height="56"><span class="at"><b>' + esc(a.name) + '</b><span>' + esc(a.tagline) + '</span><span>Версия ' + esc(a.version) + ' · ' + esc(fmtDate(a.date)) + ' · ' + plural(a.archives, 'архив', 'архива', 'архивов') + ' и журнал обновлений</span></span><span class="go">Открыть страницу →</span></a></li>';
    }).join('') + '</ul>';
  }

  /* Последняя сборка */
  if (latest) {
    $('#latest').innerHTML =
      '<div class="latest"><div><p class="tag">Последняя сборка</p>' +
      '<h2 id="latest-h">Версия ' + esc(latest.version) + (latest.name ? ' «' + esc(latest.name) + '»' : '') + '</h2>' +
      '<p class="meta">' + (latest.date ? esc(fmtDate(latest.date)) + ' · ' : '') + fmtSize(latest.archive.size) + '<br><code>' + esc(latest.archive.name) + '</code></p>' +
      '<div class="acts">' + dlBtn(latest, 'is-main') + '<a class="btn is-ghost" href="#changelog">Весь журнал</a></div></div>' +
      '<div><h3>Что нового</h3><ul>' + latest.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></div>';
  }

  /* Статус Google Диска */
  var ICON_UP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96M14 13v4h-4v-4H7l5-5 5 5z"/></svg>';
  var dEl = $('#drive');
  var SRV = 'Google Drive';
  if (SA) {
    dEl.innerHTML = DRIVE.folder_url ? '<span class="chip is-ok"><span class="dot"></span>Копия на Google Диске</span><span>Папка <b>«' + esc(DRIVE.folder_name || 'МайМани') + '»</b>. <a href="' + esc(DRIVE.folder_url) + '" target="_blank" rel="noopener">Открыть папку</a></span><span class="msg">Копирование на Диск работает только на странице в Claude. Здесь архивы просто скачиваются.</span>' : '';
  } else if (DRIVE.status === 'connected' && DRIVE.folder_id) {
    dEl.innerHTML = '<span class="chip is-ok"><span class="dot"></span>Google Диск подключён</span>' +
      '<span>Папка <b>«' + esc(DRIVE.folder_name || 'МайМани') + '»</b>. <a href="' + esc(DRIVE.folder_url || '#') + '" target="_blank" rel="noopener">Открыть папку</a></span>' +
      '<button type="button" class="btn is-main" id="sync">' + ICON_UP + 'Скопировать на Диск</button>' +
      '<span class="msg" id="syncmsg" role="status" aria-live="polite">Загрузит в папку архивы, которых там ещё нет, от вашего имени. Работает, когда страница открыта в Claude.</span>';
  } else {
    dEl.innerHTML = '<span class="chip is-line"><span class="dot"></span>Google Диск не подключён</span><span>Когда подключение будет включено в Claude, архивы можно будет копировать в папку на Диске прямо отсюда.</span>';
  }

  /* Список архивов */
  var GRP = { site: 'Сайт My Money, версии 2.x–4.x', other: 'Прототипы и виджет, 1 ноября 2026', early: 'Ранние сборки, 27 октября 2026' }, lastG = null;
  $('#arch').innerHTML = withArch.map(function (r) {
    var a = r.archive, h = '';
    if (r.group !== lastG) { lastG = r.group; h = '<li class="grp">' + esc(GRP[r.group] || '') + '</li>'; }
    var drv = r.drive_url ? '<a class="btn is-ghost" href="' + esc(r.drive_url) + '" target="_blank" rel="noopener">На Диске</a>' : '<span class="dst" data-dst="' + esc(a.name) + '"></span>';
    var sub = fmtSize(a.size) + (r.kind ? ' · ' + KIND[r.kind] : '') + (r.name && r.group === 'early' ? ' · «' + esc(r.name) + '»' : '') + (r.date && r.group !== 'early' ? ' · ' + esc(fmtDate(r.date)) : (r.time ? ' · ' + esc(r.time) : '')) + (r === latest ? ' · последняя' : '');
    return h + '<li class="row"><span class="v">' + esc(r.version) + '</span>' +
      '<div class="f"><b title="SHA-256: ' + esc(a.sha256) + '">' + esc(a.name) + '</b><span>' + sub + '</span>' + (r.warn ? '<span class="warn">' + esc(r.warn) + '</span>' : '') + '</div>' +
      '<div class="a">' + dlBtn(r, r === latest ? 'is-main' : '') + drv + '</div></li>';
  }).join('');

  (function () {
    var base = 'Для версий сайта 2.8–4.6 архивов нет, их описание есть в журнале. Ранние сборки (APK и веб-версии «Money 1.x») описаны по сравнению файлов в архивах: часть APK-версий содержит код соседних веб-версий.';
    $('#archnote').textContent = base + ' Шесть архивов Android APK (1.0, 1.1, 1.2, 2.0, 2.1, 2.12) здесь не размещены: внутри них ключ подписи приложения и пароль к нему. Их описание в журнале есть. Контрольные суммы SHA-256 видны в подсказке к имени файла.';
  })();

  function shotsHtml(r) {
    if (!r.shots || !r.shots.length) return '';
    return '<div class="shots">' + r.shots.map(function (s) {
      return '<figure><a href="' + esc(s.src) + '" target="_blank" rel="noopener"><img src="' + esc(s.src) + '" alt="' + esc(s.cap) + '" loading="lazy"></a><figcaption>' + esc(s.cap) + '</figcaption></figure>';
    }).join('') + '</div>';
  }

  /* Журнал изменений */
  var logEl = $('#log');
  logEl.innerHTML = REL.map(function (r, i) {
    var pills = '';
    if (i === 0) pills += '<span class="pill is-cur">текущая</span>';
    if (r.kind) pills += '<span class="pill">' + KIND[r.kind] + '</span>';
    if (r.flag) pills += '<span class="pill is-warn">' + esc(r.flag) + '</span>';
    if (r.archive) pills += '<span class="pill">есть архив</span>';
    if (r.held) pills += '<span class="pill">архив не размещён</span>';
    var when = fmtWhen(r) ? ' · ' + esc(fmtWhen(r)) : '';
    return '<details class="rel"' + (i < 2 ? ' open' : '') + ' data-t="' + esc((r.version + ' ' + r.name + ' ' + (r.kind ? KIND[r.kind] : '') + ' ' + r.items.join(' ')).toLowerCase()) + '">' +
      '<summary><span class="rv">' + esc(r.version) + '</span><span class="rn">' + (r.name ? '«' + esc(r.name) + '»' : '') + when + '</span><span class="rt">' + pills + CHEV + '</span></summary>' +
      '<div class="body"><ul>' + r.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' + shotsHtml(r) + (r.held ? '<p class="note">' + esc(r.held) + ' Файл: ' + esc(r.held_name) + ', SHA-256 ' + esc(r.held_sha256) + '.</p>' : '') + '</div></details>';
  }).join('') + '<div class="empty" id="none" hidden>Ничего не найдено. Попробуйте другое слово.</div>';

  var qEl = $('#q'), countEl = $('#count'), noneEl = $('#none');
  var all = Array.prototype.slice.call(logEl.querySelectorAll('details.rel'));
  var openDefault = all.map(function (d) { return d.open; });
  function filter() {
    var q = qEl.value.trim().toLowerCase(), n = 0;
    all.forEach(function (d, i) {
      var hit = !q || d.getAttribute('data-t').indexOf(q) !== -1;
      d.hidden = !hit; if (hit) n++;
      d.open = q ? hit : openDefault[i];
    });
    noneEl.hidden = n !== 0;
    countEl.textContent = q ? 'Найдено: ' + n + ' из ' + all.length : all.length + ' записей';
  }
  qEl.addEventListener('input', filter); filter();

  $('#foot').textContent = 'Страница обновляется вместе с каждой новой сборкой сайта: добавляется архив и запись в журнале.';

  /* Скачивание. Файл лежит на странице как base64-текст: страница собирает из него zip, сверяет SHA-256 и предлагает сохранить
     через возможность «downloads» (зритель подтверждает сохранение). Вне Claude этой возможности нет. */
  var toastEl = $('#toast'), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 5200); }
  var capP;
  function cap() { if (!capP) capP = (window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null)).catch(function () { return null; }); return capP; }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function decode(b64) {
    var bin = atob(b64.replace(/\s+/g, '')), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button[data-dl]');
    if (!b) return;
    var file = b.getAttribute('data-file'), name = b.getAttribute('data-name'), sha = b.getAttribute('data-sha');
    b.setAttribute('aria-busy', 'true');
    cap().then(function (dl) {
      if (!dl) { toast('Скачивание работает, когда страница открыта в Claude (сайт или приложение).'); return; }
      return fetch(file).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (txt) {
          var u = decode(txt);
          var check = window.crypto && crypto.subtle ? crypto.subtle.digest('SHA-256', u).then(function (h) { return hex(h) === sha; }) : Promise.resolve(true);
          return check.then(function (ok) {
            if (!ok) { var er = new Error('sha'); er.code = 'sha'; throw er; }
            return dl.save({ filename: name, data: new Blob([u], { type: 'application/zip' }) });
          });
        })
        .then(function () { toast('Сохранено: ' + name + ' · контрольная сумма совпала'); });
    }).catch(function (err) {
      toast(err && err.code === 'declined' ? 'Сохранение отменено.' : err && err.code === 'sha' ? 'Контрольная сумма не совпала, файл не сохранён.' : 'Не удалось скачать файл. Обновите страницу и попробуйте ещё раз.');
    }).then(function () { b.removeAttribute('aria-busy'); });
  });

  /* Копирование на Google Диск от имени зрителя (возможность «mcp», коннектор Google Drive).
     Сначала смотрим, что уже лежит в папке, и грузим только недостающее: повторное нажатие дубликатов не создаёт. */
  var syncBtn = $('#sync'), syncMsg = $('#syncmsg'), busy = false;
  function say(txt, kind) { if (syncMsg) { syncMsg.textContent = txt; syncMsg.setAttribute('data-k', kind || ''); } }
  function setDst(name, html) { var el = document.querySelector('[data-dst="' + name.replace(/"/g, '\\"') + '"]'); if (el) el.innerHTML = html; }
  function dstLink(url) { return url ? '<a class="btn is-ghost" href="' + esc(url) + '" target="_blank" rel="noopener">На Диске</a>' : '<span class="chip is-ok"><span class="dot"></span>На Диске</span>'; }
  function scan(x, out) {
    if (!x || typeof x !== 'object') return out;
    if (Array.isArray(x)) { x.forEach(function (i) { scan(i, out); }); return out; }
    var nm = typeof x.title === 'string' ? x.title : typeof x.name === 'string' ? x.name : null;
    if (nm && typeof x.id === 'string') out[nm] = x.viewUrl || x.webViewLink || null;
    Object.keys(x).forEach(function (k) { if (x[k] && typeof x[k] === 'object') scan(x[k], out); });
    return out;
  }
  function why(err) {
    var c = err && err.code;
    if (c === 'server_not_connected' || c === 'selection_required') return 'Google Drive не подключён к вашему аккаунту Claude. Подключите его в Настройки → Коннекторы и откройте страницу снова.';
    if (c === 'needs_reauth') return 'Доступ к Google Drive истёк. Переподключите его в Настройки → Коннекторы.';
    if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'Доступ к Google Drive для этой страницы не разрешён. Нажмите кнопку ещё раз и разрешите доступ.';
    if (c === 'blocked_by_policy') return 'Администратор организации запретил эту операцию в Google Drive.';
    if (c === 'tool_error') return 'Google Drive отказал: ' + (err.message ? String(err.message).slice(0, 160) : 'ошибка операции') + '.';
    return 'Не получилось связаться с Google Drive (' + (c || 'ошибка') + '). Нажмите кнопку ещё раз, уже загруженное повторно не отправится.';
  }
  function sync() {
    if (busy) return; busy = true; syncBtn.setAttribute('aria-busy', 'true');
    var mcpRef, fileArgs = false, have = {}, done = 0, fail = 0, skipped = 0;
    (window.claude && window.claude.use ? window.claude.use('mcp') : Promise.resolve(null)).catch(function () { return null; })
      .then(function (mcp) {
        if (!mcp) { say('Копирование на Диск работает, когда страница открыта в Claude (сайт или приложение).', 'err'); throw { stop: true }; }
        mcpRef = mcp; say('Проверяю папку на Диске…');
        return mcp.listTools().then(function (l) { fileArgs = !!(l && l.fileArgs); }, function () {});
      })
      .then(function () {
        return mcpRef.callTool(SRV, 'search_files', { query: "parentId = '" + DRIVE.folder_id + "' and trashed = false", pageSize: 200, excludeContentSnippets: true }, { cache: false });
      })
      .then(function (res) {
        have = scan(res && (res.payload !== undefined ? res.payload : res.structuredContent), {});
        var todo = withArch.filter(function (r) { return !Object.prototype.hasOwnProperty.call(have, r.archive.name); });
        withArch.forEach(function (r) { if (Object.prototype.hasOwnProperty.call(have, r.archive.name)) setDst(r.archive.name, dstLink(have[r.archive.name])); });
        if (!todo.length) { say('Все архивы уже лежат в папке на Диске.', 'ok'); return; }
        var i = 0;
        function next() {
          if (i >= todo.length) return;
          var r = todo[i++], a = r.archive;
          say('Загружаю ' + a.name + ' (' + i + ' из ' + todo.length + ')…'); setDst(a.name, '<span class="dst">Загрузка…</span>');
          return fetch(a.file).then(function (x) { if (!x.ok) throw { code: 'fetch' }; return x.text(); }).then(function (txt) {
            txt = txt.replace(/\s+/g, '');
            var content;
            if (txt.length <= 1000000) content = txt;
            else if (fileArgs) content = { $file: { data: decode(txt), name: a.name, type: 'application/zip' } };
            else { skipped++; setDst(a.name, '<span class="dst">слишком большой</span>'); return; }
            return mcpRef.callTool(SRV, 'create_file', { title: a.name, parentId: DRIVE.folder_id, contentMimeType: 'application/zip', disableConversionToGoogleType: true, base64Content: content }, { cache: false })
              .then(function (res) {
                var p = res && res.payload, u = p && typeof p === 'object' ? (p.viewUrl || null) : null;
                done++; setDst(a.name, dstLink(u));
              });
          }).then(next);
        }
        return next();
      })
      .then(function () {
        if (done || skipped) say('Готово: загружено ' + done + (skipped ? ', пропущено слишком больших: ' + skipped : '') + '. Папка «' + (DRIVE.folder_name || 'МайМани') + '» обновлена.', skipped ? 'err' : 'ok');
      })
      .catch(function (err) {
        if (err && err.stop) return;
        if (err && err.code === 'fetch') { say('Не удалось прочитать архив на странице. Обновите страницу и попробуйте ещё раз.', 'err'); return; }
        say(why(err), 'err');
        withArch.forEach(function (r) { var el = document.querySelector('[data-dst="' + r.archive.name + '"]'); if (el && /Загрузка/.test(el.textContent)) el.innerHTML = ''; });
      })
      .then(function () { busy = false; syncBtn.removeAttribute('aria-busy'); });
  }
  if (syncBtn) syncBtn.addEventListener('click', sync);
})();
</script>
