<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мое_лента</title>
<meta name="theme-color" content="#e8641b">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; media-src https:; connect-src 'self' https:; base-uri 'none'; object-src 'none'; form-action 'none'">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Мое_лента</h1>
  <input id="search" type="search" placeholder="Поиск" aria-label="Поиск по записям">
  <button id="refresh" title="Обновить" aria-label="Обновить">↻</button>
</header>
<nav id="nav">
  <button data-page="feed">📰<span>Лента</span></button>
  <button data-page="subs">➕<span>Подписки</span></button>
  <button data-page="mine">📡<span>Своя RSS</span></button>
  <button data-page="settings">⚙️<span>Настройки</span></button>
</nav>
<main id="main"></main>
<div id="player" hidden>
  <div id="ptitle"></div>
  <audio id="audio" controls preload="none"></audio>
  <select id="speed" aria-label="Скорость"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  <button id="pclose" aria-label="Закрыть плеер">✕</button>
</div>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
