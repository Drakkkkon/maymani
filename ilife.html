  --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1); --spring: cubic-bezier(.34, 1.45, .55, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --line: #49454f;
    --primary: #d0bcff; --on-primary: #381e72; --pc: #4f378b; --on-pc: #eaddff;
    --sc: #4a4458; --on-sc: #e8def8; --s1: #1d1b20; --s2: #211f26; --s3: #2b2930;
    --ok: #86d99a; --ok-bg: #14361f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --line: #49454f;
  --primary: #d0bcff; --on-primary: #381e72; --pc: #4f378b; --on-pc: #eaddff;
  --sc: #4a4458; --on-sc: #e8def8; --s1: #1d1b20; --s2: #211f26; --s3: #2b2930;
  --ok: #86d99a; --ok-bg: #14361f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { width: 100%; max-width: 1000px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 10px; }

/* ---- Шапка: большая надпись ---- */
.hero { position: relative; overflow: hidden; padding-block: clamp(28px, 6vw, 64px) clamp(24px, 4vw, 40px); }
.hero::before { /* крупная «лепёшка» фирменной формы Material 3 позади надписи */
  content: ""; position: absolute; width: min(78vw, 640px); aspect-ratio: 1; right: -14vw; top: -12vw; border-radius: 38%; background: var(--pc); opacity: .65; transform: rotate(14deg); z-index: 0;
}
.hero .wrap { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 12px; margin: 0 0 clamp(8px, 2vw, 20px); color: var(--muted); font-size: 15px; font-weight: 500; }
.brand img { width: 44px; height: 44px; border-radius: 14px; display: block; }
.word { margin: 0; font-weight: 700; font-size: clamp(3.2rem, 18vw, 12.5rem); line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
.word .w1 { color: var(--primary); }
.lead { max-width: 34em; margin: clamp(14px, 2.5vw, 26px) 0 0; font-size: clamp(1.05rem, 2.6vw, 1.35rem); line-height: 1.4; color: var(--muted); text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: clamp(16px, 3vw, 28px) 0 0; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 12px; background: var(--sc); color: var(--on-sc); font-size: 14px; font-weight: 500; text-decoration: none; }
.chip.is-line { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.chip.is-ok { background: var(--ok-bg); color: var(--ok); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* ---- Разделы ---- */
section { padding-block: clamp(22px, 4vw, 40px) 0; }
h2 { margin: 0 0 14px; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 600; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.sub { margin: -6px 0 18px; color: var(--muted); max-width: 42em; }

/* Кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; background: var(--sc); color: var(--on-sc);
  transition: border-radius .28s var(--spring), box-shadow .2s var(--ease), transform .2s var(--ease); }
.btn:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 9%, transparent); }
.btn:active { border-radius: 16px; }
.btn.is-main { background: var(--primary); color: var(--on-primary); }
.btn.is-ghost { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--line); }
.btn[aria-busy="true"] { opacity: .65; pointer-events: none; }
.btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }

/* Последняя сборка */
.latest { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: clamp(20px, 4vw, 44px); padding: clamp(22px, 4vw, 40px); border-radius: 36px; background: var(--pc); color: var(--on-pc); }
.latest h2 { margin-bottom: 6px; font-size: clamp(1.9rem, 5vw, 2.8rem); }
.latest .tag { margin: 0 0 10px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.latest .meta { margin: 0 0 22px; font-size: 15px; opacity: .85; }
.latest .meta code { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.latest .acts { display: flex; flex-wrap: wrap; gap: 10px; }
.latest .btn.is-ghost { color: var(--on-pc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-pc) 40%, transparent); }
.latest h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.latest ul { margin: 0; padding-left: 1.15em; display: grid; gap: 8px; font-size: 15px; line-height: 1.45; }
.latest li::marker { color: var(--primary); }
.latest > * { min-width: 0; }

/* Список архивов */
.arch { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; padding: 14px 16px 14px 20px; background: var(--s2); border-radius: 8px; }
.row:first-child { border-radius: 28px 28px 8px 8px; }
.row:last-child { border-radius: 8px 8px 28px 28px; }
.row:only-child { border-radius: 28px; }
.row .v { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.row .f { min-width: 0; }
.row .f b { display: block; font-weight: 500; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.row .f span { display: block; margin-top: 2px; color: var(--muted); font-size: 13.5px; }
.row .a { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.row .btn { min-height: 44px; padding: 0 18px; }
.drive { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; padding: 12px 16px; border-radius: 20px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); font-size: 14.5px; color: var(--muted); }
.drive b { color: var(--fg); font-weight: 600; }
.drive .btn { min-height: 44px; padding: 0 20px; }
.drive .msg { flex: 1 1 100%; font-size: 14px; color: var(--muted); }
.drive .msg[data-k="err"] { color: #b3261e; }
:root[data-theme="dark"] .drive .msg[data-k="err"] { color: #f2b8b5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .drive .msg[data-k="err"] { color: #f2b8b5; } }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
.shots figure { margin: 0; min-width: 0; }
.shots a { display: block; border-radius: 16px; overflow: hidden; background: var(--s2); box-shadow: inset 0 0 0 1px var(--line); }
.shots img { display: block; width: 100%; height: 340px; object-fit: contain; object-position: top center; background: var(--s2); }
.shots figcaption { margin: 6px 4px 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
@media (min-width: 900px) { .shots { grid-template-columns: repeat(2, minmax(0, 300px)); } .shots img { height: 380px; } }
.grp { list-style: none; margin: 22px 0 8px; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grp:first-child { margin-top: 0; }
.row .f .warn { display: block; margin-top: 4px; font-size: 12.5px; line-height: 1.4; color: #8a5300; }
:root[data-theme="dark"] .row .f .warn { color: #ffb95c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .row .f .warn { color: #ffb95c; } }
.pill.is-warn { background: color-mix(in srgb, #b3261e 14%, transparent); color: #b3261e; }
:root[data-theme="dark"] .pill.is-warn { color: #f2b8b5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.is-warn { color: #f2b8b5; } }
.dst { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--muted); }
.dst .chip { margin: 0; }
.note { margin: 14px 4px 0; color: var(--muted); font-size: 14px; max-width: 46em; }


/* Другие приложения */
.apps { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.app { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; padding: 14px 18px; background: var(--s2); border-radius: 28px; text-decoration: none; color: var(--fg); }
.app:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--fg) 6%, transparent); }
.app img { width: 56px; height: 56px; border-radius: 16px; display: block; }
.app .at { min-width: 0; display: block; }
.app .at b { display: block; font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
.app .at span { display: block; color: var(--muted); font-size: 14px; }
.app .go { color: var(--primary); font-weight: 600; font-size: 15px; white-space: nowrap; }
@media (max-width: 760px) { .app { grid-template-columns: 48px minmax(0, 1fr); } .app img { width: 48px; height: 48px; } .app .go { grid-column: 1 / -1; } }

/* Журнал изменений */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; border-radius: 16px; background: var(--s3); box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .2s var(--ease); }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
.search svg { width: 22px; height: 22px; fill: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; }
.search input::placeholder { color: var(--muted); opacity: .85; }
.count { color: var(--muted); font-size: 14px; }
.log { display: grid; gap: 3px; margin: 0; padding: 0; }
details.rel { background: var(--s2); border-radius: 8px; }
details.rel:first-child { border-radius: 24px 24px 8px 8px; }
details.rel:last-child { border-radius: 8px 8px 24px 24px; }
details.rel:only-child { border-radius: 24px; }
details.rel[open] { background: var(--s1); box-shadow: inset 0 0 0 1px var(--line); }
details.rel summary { display: grid; grid-template-columns: 6rem minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 14px 18px 14px 20px; cursor: pointer; list-style: none; border-radius: inherit; }
details.rel summary::-webkit-details-marker { display: none; }
details.rel summary:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--fg) 6%, transparent); }
.rel .rv { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.rel .rn { color: var(--muted); font-size: 14.5px; min-width: 0; }
.rel .rt { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 8px; background: var(--sc); color: var(--on-sc); font-size: 12.5px; font-weight: 600; }
.pill.is-cur { background: var(--primary); color: var(--on-primary); }
.chev { width: 22px; height: 22px; fill: var(--muted); transition: transform .25s var(--ease); flex: none; }
details[open] .chev { transform: rotate(180deg); }
.rel .body { padding: 2px 20px 18px calc(20px + 6rem + 14px); }
.rel .body ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; max-width: 62em; }
.rel .body li { text-wrap: pretty; }
.rel .body li::marker { color: var(--primary); }
.empty { padding: 24px; border-radius: 24px; background: var(--s2); color: var(--muted); text-align: center; }

footer { padding-block: clamp(28px, 5vw, 56px) max(32px, env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; }
footer p { margin: 0; max-width: 46em; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none; max-width: min(92vw, 460px); padding: 14px 20px; border-radius: 16px; background: var(--fg); color: var(--bg); font-size: 14.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .25s var(--ease), transform .3s var(--spring); z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .latest { grid-template-columns: 1fr; border-radius: 28px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; padding: 16px 16px 16px 18px; }
  .row .v { grid-column: 1 / -1; }
  .row .a { grid-column: 1 / -1; justify-content: stretch; }
  .row .a .btn { flex: 1 1 140px; }
  details.rel summary { grid-template-columns: minmax(0, 1fr); }
  .rel .rn { grid-column: 1 / -1; grid-row: 2; }
  .rel .rt { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; align-items: center; }
  .rel .rt .chev { margin-left: auto; }
  .rel .body { padding-left: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; scroll-behavior: auto !important; } }

/* Страница iLife */
.back { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 clamp(8px, 2vw, 18px); min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--sc); color: var(--on-sc); font-size: 14.5px; font-weight: 600; text-decoration: none; }
.back:hover { box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 9%, transparent); }
.rel .body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 15px; line-height: 1.5; max-width: 62em; }
.rel .body ol li::marker { color: var(--primary); font-weight: 700; }
.rel .body p { margin: 10px 0 0; color: var(--muted); font-size: 14.5px; max-width: 62em; }
.rel .body code { font-family: var(--mono); font-size: 13px; background: var(--s3); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.drive .btn.is-main { min-height: 44px; }
</style>

gle просит подтверждать вход раз в час — для этого есть кнопка «Продолжить синхронизацию» и уведомление с такой же кнопкой.", "Client ID из Google Cloud вставляется в поле в Настройках (хранится на устройстве) или вписывается в js/config.js, чтобы быть сразу на всех устройствах (образец — js/config.example.js). Подробная пошаговая инструкция по GitHub Pages и подключению Google — в README_RU.txt внутри архива.", "Данные версии 1.0.0 сохраняются без изменений; делам и ценам без времени изменения оно проставляется по дате добавления. Восстановление «с нуля»: после очистки данных сайта достаточно снова войти через Google.", "По файлам архива, относительно 1.0.0: файлов в сборке: 29 (в 1.0.0 было 25); добавлено 4 (js/gdrive.js, js/config.example.js, .nojekyll, .gitignore); изменено 8 (README_RU.txt, index.html, js/app.js, js/core.js, js/ideas.js, js/settings.js и ещё 2)."], "archive": {"file": "archives/iLife_v1.1.0.zip", "name": "iLife_v1.1.0.zip", "size": 405052, "sha256": "5007bf186f23dc153d9904356c26860de0fefadb780c667ec60c5eb9c7ac8ed3"}, "shots": [{"src": "shots/ilife-v1.1.0-1.jpg", "cap": "Google Диск подключён (демо-аккаунт)"}, {"src": "shots/ilife-v1.1.0-2.jpg", "cap": "Вход через Google: Client ID и адрес сайта"}]}, {"version": "1.0.0", "name": "Первая версия", "date": "2026-11-05", "time": "14:41", "items": ["«Идеи»: поиск по словам, #хештегам и датам; блок ввода с текстом, хештегами, картинками, музыкой, диктофоном, файлами и кнопкой Spotify; у каждой заметки дата создания и автор.", "«Дела»: список покупок из My Money 4.8.1 (количество, цены, валюты, «в прошлый раз», магазины), расширенный списком дел со сроками; записи по датам и с именем автора.", "PDF: отдельные кнопки для идей и для дел (шрифт с кириллицей, нумерация страниц).", "«Настройки»: заглушка Google-аккаунта и Google Диска, Spotify, масштаб 50–200%, пять тем Android, шрифт, профиль, резервная копия в JSON. Дизайн и логика — из My Money 4.8.1."], "archive": {"file": "archives/iLife_v1.0.0.zip", "name": "iLife_v1.0.0.zip", "size": 385667, "sha256": "d31c12709cf9fdf3268e9718e8c0d3f559b20284ada525e5a3d3e770fb3ee338"}, "shots": [{"src": "shots/ilife-v1.0.0-1.jpg", "cap": "Идеи: поиск, хештеги, блок ввода (демо-данные)"}, {"src": "shots/ilife-v1.0.0-2.jpg", "cap": "Дела и покупки с ценами (демо-данные)"}]}]}</script>
<script>

  function plural(n, a, b, c) { var m = n % 100, k = n % 10; return n + ' ' + (m > 10 && m < 15 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c); }

    '<p class="meta">' + esc(fmtDate(latest.date)) + ' · ' + fmtSize(latest.archive.size) + '<br><code>' + esc(latest.archive.name) + '</code></p>' +
    '<div class="acts">' + dl(latest, 'is-main') + '<a class="btn is-ghost" href="#install">Как установить</a><a class="btn is-ghost" href="#changelog">Журнал</a></div></div>' +
    '<div><h3>Что нового</h3><ul>' + latest.items.slice(0, 5).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></div>';

  /* Google Диск */

    '<a class="btn is-main" href="' + esc(DRIVE.folder_url) + '" target="_blank" rel="noopener">' + ICON_OPEN + 'Открыть папку</a>';
  var files = [{ k: 'Папка', n: DRIVE.folder_name + '/', note: 'Архивы версий iLife и журнал. Сюда кладите скачанные архивы iLife_vX.zip.', url: DRIVE.folder_url }]
    .concat((DRIVE.files || []).map(function (f) { return { k: 'Файл', n: f.name, note: f.note, url: f.url }; }));

  }).join('');
  $('#drivenote').textContent = 'Данные самого приложения лежат в другой папке — «iLife» в корне вашего Google Диска: она появится после первого входа через Google в настройках iLife (идеи, дела, ilife_data.json и папка «Вложения»). Zip-архивы версий в папку «' + DRIVE.folder_name + '» загрузите вручную (перетащите скачанные файлы в окно Диска) — автоматически их отсюда скопировать нельзя: эта страница работает без Claude.';

    'Settings → Pages → Source: «Deploy from a branch», Branch: main, «/ (root)» → Save. Через 1–3 минуты сайт откроется по адресу https://ВАШ-ЛОГИН.github.io/ilife/.',

    'Google Диск: в Google Cloud включите Google Drive API, создайте OAuth Client ID (Web application) и добавьте в «Authorized JavaScript origins» адрес https://ВАШ-ЛОГИН.github.io. В iLife: Настройки → «Google Диск» → вставьте Client ID → «Войти через Google».',

  /* Журнал */
  $('#log').innerHTML = REL.map(function (r, i) {
    var pills = (i === 0 ? '<span class="pill is-cur">текущая</span>' : '') + '<span class="pill">есть архив</span>';
    var shots = r.shots && r.shots.length ? '<div class="shots">' + r.shots.map(function (s) { return '<figure><a href="' + esc(s.src) + '" target="_blank" rel="noopener"><img src="' + esc(s.src) + '" alt="' + esc(s.cap) + '" loading="lazy"></a><figcaption>' + esc(s.cap) + '</figcaption></figure>'; }).join('') + '</div>' : '';
    return '<details class="rel"' + (i < 2 ? ' open' : '') + '><summary><span class="rv">' + esc(r.version) + '</span><span class="rn">«' + esc(r.name) + '» · ' + esc(fmtDate(r.date)) + (r.time ? ', ' + esc(r.time) : '') + '</span><span class="rt">' + pills + CHEV + '</span></summary>' +
      '<div class="body"><ul>' + r.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' + shots + '</div></details>';
  }).join('');

  $('#foot').textContent = 'Страница обновляется вместе с каждой новой версией iLife: добавляется архив и запись в журнале. Главная страница — МайМани.';
})();
</script>
</body>
</html>
