<!DOCTYPE html>
<html lang="ru" data-v="1.5.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#20324a">
<title>Мое_город</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=1.5.0">
</head>
<body>
<canvas id="scene"></canvas>

<header class="topbar">
  <div class="brand">🏙️ <b>Мое_город</b> <span class="ver" id="ver"></span></div>
  <button class="world-chip" id="worldChip" type="button" aria-label="Миры">🌍 <b id="worldName">…</b> <i id="worldCloud"></i></button>
  <div class="stats" id="stats">
    <div class="srow">
      <span class="money" title="Доллары">$ <b id="stMoney">∞</b></span>
      <span title="Жители">👥 <b id="stPeople">0</b></span>
      <span id="stJobsWrap" title="Рабочие места">💼 <b id="stJobs">0</b></span>
      <span title="Здания">🏢 <b id="stBuild">0</b></span>
      <span class="off" id="stOffWrap" hidden>🚫 <b id="stOff">0</b></span>
      <span class="fps" id="stFps" hidden>FPS <b id="stFpsN">0</b></span>
    </div>
    <div class="srow need" id="rowNeeds" title="Люди и социальные нужды">
      <span id="stFoodWrap" title="Еда на рынках">🍞 <b id="stFood">0</b></span>
      <span id="stWaterWrap" title="Вода: покупается на рынке">💧 <b id="stWater">—</b></span>
      <span class="dim" id="stPowerWrap" title="Электричества в городе пока нет — электростанции появятся позже">⚡ <b>—</b></span>
      <span id="stUnrestWrap" title="Недовольство народа">😠 <b id="stUnrest">0%</b></span>
    </div>
    <div class="srow mats" id="rowMats" title="Материалы">
      <span class="stock stone" id="stStoneWrap" hidden>🪨 <b id="stStone">0</b> ⚪ <b id="stGravel">0</b></span>
      <span class="stock" id="stStockWrap" hidden><span id="stLogsWrap">🪵 <b id="stLogs">0</b> </span>🪚 <b id="stBoards">0</b> 🟫 <b id="stDsp">0</b></span>
    </div>
    <div class="srow goods" id="rowGoods" title="Товары (здания для них появятся позже)">
      <span class="stock" id="stGoodsWrap">🧵 <b id="stFabric">0</b> 👕 <b id="stClothes">0</b> 🚬 <b id="stTobacco">0</b> ⚫ <b id="stCoal">0</b></span>
    </div>
  </div>
  <button class="icon-btn pause" id="btnPause" data-nosnd aria-label="Пауза" title="Пауза">⏸</button>
  <button class="icon-btn" id="btnMenu" data-nosnd aria-label="Меню" aria-expanded="false" aria-controls="sidebar">☰</button>
</header>

<div class="cam-btns">
  <button class="icon-btn" id="camRotL" aria-label="Повернуть камеру влево">⟲</button>
  <button class="icon-btn" id="camRotR" aria-label="Повернуть камеру вправо">⟳</button>
  <button class="icon-btn" id="camIn" aria-label="Приблизить">＋</button>
  <button class="icon-btn" id="camOut" aria-label="Отдалить">－</button>
</div>

<!-- Миникарта (с 0.23.0): внизу слева; над ней — координаты камеры -->
<div class="mini" id="mini">
  <div class="mini-co" id="miniCo">📍 …</div>
  <canvas id="miniMap" width="124" height="124" aria-label="Миникарта"></canvas>
</div>

<div class="hint" id="hint"></div>
<div class="chunk-note" id="chunkNote" hidden>⏳ Подгружаем карту…</div>

<!-- Панель: на телефоне кнопки внизу экрана, на компьютере и планшете — одна панель сбоку:
     сверху главные кнопки, ниже меню построек (2 колонки × 10 рядов) -->
<div class="dock" id="dock">
  <nav class="toolbar" id="toolbar">
    <button class="tool" data-tool="view"><span>👁️</span><small>Смотреть</small></button>
    <button class="tool" data-tool="build"><span>🏠</span><small>Строить</small></button>
    <button class="tool" data-tool="road"><span>🛣️</span><small>Дорога</small></button>
    <button class="tool" data-tool="move"><span>✋</span><small>Перенести</small></button>
    <button class="tool" data-tool="delete"><span>🗑️</span><small>Удалить</small></button>
    <button class="tool mech" data-tool="mech"><span>🚚</span><small>Механизмы</small></button>
    <button class="tool epochs" data-tool="epochs"><span>🕰️</span><small>Эпохи</small></button>
    <button class="tool home" data-tool="home" title="Вернуться в центр карты (клавиша 8)"><span>🎯</span><small>Центр</small></button>
  </nav>

  <section class="subpanel" id="panelRoad" hidden>
    <div class="row chips" id="roadChips"></div>
  </section>

  <section class="subpanel" id="panelBuild" hidden>
    <div class="row catrow" id="catRow">
      <button class="catbtn" id="catBtn" aria-haspopup="true" aria-expanded="false" title="Категории зданий">
        <span class="cl">Категория</span><span class="sw" id="catSw"></span><b id="catCur">Все</b><i>▾</i>
      </button>
      <button class="chip rot" id="btnRotate" title="Повернуть (R)">↻</button>
      <div class="catlist" id="catChips" role="menu" hidden></div>
    </div>
    <!-- Покупка бригады (с 0.15.0). На компьютере и планшете стоит вверху панели справа (order в css), на телефоне — под кнопкой «Категория»:
         там список категорий раскрывается вверх и не закрывает эту строку -->
    <div class="brrow" id="brRow">
      <span class="bri" id="brImg"></span>
      <span class="brt"><b>Бригады: <em id="brN">0</em></b><small id="brSub"></small></span>
      <button class="brbuy" id="brBuy" type="button"></button>
    </div>
    <!-- Несколько зданий сразу (с 1.1.0): включить и протянуть рамку по карте; «С дорогой» — между зданиями клетка с дорогой.
         Эпоха выбирается не здесь, а одна на весь город — кнопкой «Эпохи» справа вверху -->
    <div class="row multirow" id="multiRow">
      <button class="chip multi" id="btnMulti" type="button" aria-pressed="false" title="Несколько зданий сразу: протяните рамку по карте (M)">▦ Несколько</button>
      <button class="chip multi" id="btnMultiRoad" type="button" aria-pressed="false" title="Между зданиями остаётся клетка с простой дорогой" hidden>🛣️ С дорогой</button>
    </div>
    <div class="bgrid" id="bGrid"></div>
  </section>

  <!-- «Механизмы» (с 0.25.0 — вкладка в боковой панели): бригады, грузовики, здания, машины -->
  <section class="subpanel mechpanel" id="panelMech" hidden>
    <div class="tabs" id="mechTabs"></div>
    <div class="page-body" id="mechBody"></div>
  </section>
</div>

<div class="pause-note" id="pauseNote" hidden>Игра на паузе</div>

<aside class="info" id="info" hidden>
  <button class="icon-btn close" id="infoClose" aria-label="Закрыть">✕</button>
  <div id="infoBody"></div>
</aside>

<!-- Страница «Эпохи» (с 0.19.0) -->
<section class="page" id="epochs" hidden>
  <div class="page-card">
    <div class="page-head">
      <h2>🕰️ Эпохи</h2>
      <button class="icon-btn" id="epochsClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="page-body" id="epochsBody"></div>
  </div>
</section>

<!-- Меню настроек (☰): боковая панель слева (с 0.14.0) -->
<div class="sb-scrim" id="sbScrim"></div>
<aside class="sidebar" id="sidebar" aria-label="Меню" aria-hidden="true">
  <div class="sb-head">
    <button class="icon-btn sb-prev" id="sbPrev" aria-label="Назад" hidden>←</button>
    <span class="sb-sp"></span>
    <button class="icon-btn" id="sbClose" data-nosnd aria-label="Закрыть меню">✕</button>
  </div>
  <!-- Плеер (с 0.24.0): название трека над кнопками; музыка — папка music/, звуки действий рисуются в js/audio.js -->
  <div class="sb-player" id="plPlayer">
    <div class="pl-head">
      <canvas class="pl-cover" id="plCover" width="112" height="112" aria-hidden="true"></canvas>
      <div class="pl-tt"><div class="pl-title" id="plTitle">🎵 …</div><div class="pl-sub" id="plSub"></div></div>
    </div>
    <input class="pl-seek" id="plSeek" type="range" min="0" max="1000" value="0" aria-label="Перемотка трека">
    <div class="pl-btns">
      <button class="pl-btn" id="plPrev" type="button" aria-label="Предыдущий трек" title="Предыдущий трек">⏮</button>
      <button class="pl-btn pl-play" id="plPlay" type="button" aria-label="Играть" title="Играть / пауза">▶</button>
      <button class="pl-btn" id="plNext" type="button" aria-label="Следующий трек" title="Следующий трек">⏭</button>
      <button class="pl-btn pl-sfx" id="plSfx" type="button" aria-pressed="true" title="Звуки игры">🔊</button>
    </div>
    <input class="pl-search" id="plSearch" type="search" placeholder="🔎 Композитор или название" autocomplete="off" aria-label="Поиск по композитору">
    <div class="pl-list" id="plList" role="list"></div>
    <div class="pl-vols">
      <label><span>🎵 Музыка</span><input id="plVol" type="range" min="0" max="100" value="50" aria-label="Громкость музыки"></label>
      <label><span>🔨 Звуки</span><input id="plSfxVol" type="range" min="0" max="100" value="70" aria-label="Громкость звуков игры"></label>
    </div>
  </div>
  <div class="sb-body" id="sbBody"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="card">
    <button class="icon-btn close" id="modalClose" aria-label="Закрыть">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="loading" id="loading">Загрузка мира…</div>

<script src="js/babylon.js?v=1.5.0"></script>
<script src="js/data.js?v=1.5.0"></script>
<script src="js/guide.js?v=1.5.0"></script>
<script src="js/sim.js?v=1.5.0"></script>
<script src="js/audio.js?v=1.5.0"></script>
<script src="js/mm-account.js?v=1.5.0"></script>
<script src="js/world.js?v=1.5.0"></script>
<script src="js/terrain.js?v=1.5.0"></script>
<script src="js/textures.js?v=1.5.0"></script>
<script src="js/models3d.js?v=1.5.0"></script>
<script src="js/game.js?v=1.5.0"></script>
<script>
/* С 1.1.1: если игра не загрузилась за 25 секунд — кнопка «Перезагрузить» (чистит кэш страницы). */
(function () {
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (!l || l.classList.contains('done') || window.__gorodStale || l.querySelector('button')) return;
    l.innerHTML = '<div style="text-align:center;max-width:320px;padding:16px">Загрузка затянулась.<br><small style="opacity:.75">Если ничего не меняется — страница могла остаться в кэше от старой версии.</small><br><button id="reloadFresh" style="margin-top:14px;padding:10px 18px;font-size:16px;border:0;border-radius:10px;background:#f4c542;color:#1b2433;cursor:pointer">Перезагрузить</button></div>';
    document.getElementById('reloadFresh').onclick = function () {
      var go = function () { location.replace(location.pathname + '?t=' + Date.now()); };
      try { if (window.caches && caches.keys) { caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }).then(go, go); return; } } catch (e) {}
      go();
    };
  }, 25000);
})();
</script>
</body>
</html>
